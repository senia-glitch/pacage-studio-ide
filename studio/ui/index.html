<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>studio — карта проекта</title>
<style>
:root{--bg:#232428;--panel:#2e2f33;--panel2:#38393e;--hdr:#1b1c1f;--line:#45464c;--txt:#d7d7db;--dim:#9a9aa2;--acc:#e8833a;--blue:#5aa0ff;--red:#ff5d5d;--green:#7fc97f;--purple:#bb9af7;--test:#c9a86a}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 "Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--hdr);display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid #000;flex-wrap:wrap}
header .logo{font-weight:700;color:var(--acc);letter-spacing:.5px}
.seg{display:inline-flex;gap:4px;align-items:center}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);border-color:var(--acc);color:#141310;font-weight:700}
#zoomLabel{min-width:46px;text-align:center;font-size:11px;color:var(--dim)}
#stats{color:var(--dim);font-size:11px}
main{flex:1;display:grid;grid-template-columns:250px 1fr 320px;min-height:0}
#left{background:var(--panel);border-right:1px solid #000;display:flex;flex-direction:column;min-height:0}
#left h3,#right h3{margin:8px 10px 4px;font-size:11px;text-transform:uppercase;color:var(--dim);letter-spacing:.6px}
#slist{flex:1;overflow:auto;border-top:1px solid #000;padding:4px 6px}
#slist details{margin:3px 0}
#slist summary{cursor:pointer;color:var(--dim);font-size:11px;padding:2px 4px}
.sitem{padding:3px 8px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.sitem:hover{background:var(--panel2)}
.sitem.sel{background:#4a3a28;outline:1px solid var(--acc)}
.sitem small{color:var(--dim)}
.tag-plan{color:var(--acc);font-size:10px}
.tag-stale{color:var(--dim);font-size:10px}
#center{position:relative;display:flex;flex-direction:column;min-width:0}
#canvas{flex:1;position:relative;overflow:hidden;cursor:grab;min-height:0;background:#232428}
#canvas.grabbing{cursor:grabbing}
#view{transform-origin:0 0;position:absolute;left:0;top:0}
#stage{position:relative;background:radial-gradient(circle at 1px 1px,#34353b 1px,transparent 1px);background-size:22px 22px}
#edges{position:absolute;inset:0;pointer-events:none;overflow:visible}
.elab{font-size:10px;fill:#d7d7db;paint-order:stroke;stroke:#232428;stroke-width:3px;stroke-linejoin:round}
.node{position:absolute;width:230px;background:#313236;border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px #0008;user-select:none;cursor:pointer}
.node:hover{border-color:var(--acc)}
.node.sel{outline:2px solid var(--acc)}
.node .hd{padding:6px 8px;font-weight:700;color:var(--c,#888);border-bottom:2px solid var(--c,#888);background:rgba(255,255,255,.03);border-radius:10px 10px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .mt{padding:5px 8px 7px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.nested{opacity:.55;filter:saturate(.6)}
.node.ghost{opacity:.5;border-style:dashed;cursor:default}
.node.ghost:hover{border-color:var(--line)}
.colhead{position:absolute;font-weight:700;font-size:12px;padding:2px 12px;border-radius:6px;background:#1e1f22;border:1px solid var(--line);white-space:nowrap;color:var(--txt)}
.colhead i{font-style:normal;color:var(--dim);font-weight:400}
.zone{position:absolute;border:1px dashed #51525a;border-radius:14px;background:rgba(120,130,160,.045);pointer-events:none}
.zone .zlab{position:absolute;top:-10px;left:14px;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--dim);background:var(--bg);padding:1px 10px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.zone .zlab i{font-style:normal;font-weight:400;color:#7c7d85}
.node .ds{padding:0 8px 6px;font-size:10.5px;font-style:italic;color:#84858d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.node.dragging{cursor:grabbing;box-shadow:0 8px 22px #000a;opacity:.95}
.node[data-id]{cursor:grab}
.badge{position:absolute;background:#2a2b30;border:1px dashed #55565e;border-radius:16px;padding:4px 12px;font-size:11px;color:var(--dim);white-space:nowrap}
.empty{position:absolute;left:40px;top:70px;color:var(--dim);font-size:13px}
#hint{position:absolute;left:8px;bottom:6px;font-size:11px;color:#6c6d75;pointer-events:none}
#right{background:var(--panel);border-left:1px solid #000;overflow:auto;padding:10px;min-height:0}
.kv{display:flex;gap:8px;align-items:baseline;margin:5px 0;font-size:12px}
.kv span{color:var(--dim);min-width:76px;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.kv b{font-weight:600;word-break:break-all}
.dim{color:var(--dim)}
#insp button{margin-top:8px}
.docblock{margin:8px 0;padding:8px 10px;border-left:3px solid var(--acc);background:#2a2b30;border-radius:0 8px 8px 0;font-size:12px;color:#c7c8ce;white-space:pre-wrap;max-height:220px;overflow:auto;line-height:1.5}
.docblock .dhdr{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:5px}
.codewrap{margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.codehd{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 8px;background:var(--panel2);font-size:11px;color:var(--dim)}
.codehd button{padding:1px 7px;font-size:11px}
#codePre{margin:0;padding:8px;background:#1e1f22;color:#d7d7db;font:11px/15px Consolas,monospace;max-height:420px;overflow:auto;white-space:pre}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#111;border:1px solid var(--acc);color:var(--txt);padding:8px 14px;border-radius:8px;display:none;z-index:99}
.port{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid #111;cursor:crosshair;z-index:5;opacity:0;transition:opacity .15s}
.node:hover .port{opacity:1}
.port:hover{opacity:1!important;transform:scale(1.3)}
.port-t{top:-6px;left:50%;margin-left:-5px}
.port-r{top:50%;right:-6px;margin-top:-5px}
.port-b{bottom:-6px;left:50%;margin-left:-5px}
.port-l{top:50%;left:-6px;margin-top:-5px}
.edge-src{outline:2px solid var(--acc)!important}
.edge-draft{stroke:var(--acc);stroke-width:2;stroke-dasharray:6,4;fill:none;pointer-events:none}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:100}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:600px;width:90%;max-height:80vh;overflow:auto}
.modal-box h3{margin:0 0 12px;color:var(--acc)}
.modal-box .msec{margin:10px 0;font-size:12px}
.modal-box .msec b{color:var(--dim)}
.modal-box .msec .item{padding:2px 0;font-size:12px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.palette{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;border-bottom:1px solid #000}
.palette button{font-size:11px;padding:3px 7px}
.plan-list,.stale-list{padding:4px 6px}
.plan-list .pitem,.stale-list .pitem{padding:3px 8px;border-radius:5px;cursor:pointer;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-list .pitem:hover,.stale-list .pitem:hover{background:var(--panel2)}
.edit-form label{display:block;margin:8px 0 2px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.edit-form input,.edit-form textarea,.edit-form select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:5px 8px;font-size:12px;font-family:inherit}
.edit-form textarea{resize:vertical}
.edit-form input[type=checkbox]{width:auto}
.edit-form .acc-row{display:flex;gap:4px;align-items:center;margin:2px 0}
.edit-form .acc-row input{flex:1}
.edit-form .acc-row button{padding:2px 6px;font-size:10px}
</style>
</head>
<body>
<header>
<span class="logo">⬢ studio</span>
<span class="seg" id="modes">
<button data-m="scenario">Сценарий</button>
<button data-m="overview">Обзор</button>
</span>
<span class="seg" id="ovSub" style="display:none">
<button data-s="grid">Сетка</button>
<button data-s="detail">Подробно</button>
</span>
<span class="seg">
<button id="vView" class="on">View</button>
<button id="vEdit">Edit</button>
</span>
<span class="seg">
<button id="zOut" title="отдалить">−</button>
<span id="zoomLabel">100%</span>
<button id="zIn" title="приблизить">+</button>
<button id="zFit" title="вписать">вписать</button>
<button id="zReset" title="масштаб 100%">1:1</button>
</span>
<span style="flex:1"></span>
<span class="seg" id="exportSeg">
<button id="btnExport">Export ▾</button>
<div id="exportMenu" style="display:none;position:absolute;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;z-index:50">
<button id="expMd" style="display:block;width:100%;text-align:left;border:none;background:none;padding:4px 8px">Markdown</button>
<button id="expJson" style="display:block;width:100%;text-align:left;border:none;background:none;padding:4px 8px">JSON</button>
<button id="expCopy" style="display:block;width:100%;text-align:left;border:none;background:none;padding:4px 8px">Копировать Markdown</button>
</div>
</span>
<button id="btnSave" style="display:none">Save</button>
<span id="stats">—</span>
</header>
<main>
<div id="left">
<div id="viewLeft">
<h3>Сценарии</h3>
<div id="slist"></div>
</div>
<div id="editLeft" style="display:none">
<div class="palette" id="palette"></div>
<h3>План</h3>
<div class="plan-list" id="planList"></div>
<h3>Расхождения</h3>
<div class="stale-list" id="staleList"></div>
</div>
</div>
<div id="center">
<div id="canvas"><div id="view"><div id="stage"><svg id="edges"></svg></div></div>
<div id="hint">фон — панорама · колесо — зум · тяни узел — перетащить · клик — узел · Esc — снять выделение</div>
</div>
</div>
<div id="right"><h3>Инспектор</h3><div id="insp"></div></div>
</main>
<div id="toast"></div>
<div id="modal"><div class="modal-box" id="modalBox"></div></div>
<script>
const KIND_COLORS={endpoint:"#5aa0ff",scenario:"#e8833a",io:"#7fc97f",model:"#bb9af7",test:"#c9a86a",helper:"#9a9aa2"};
const EDGE_STYLE={
  dispatch:{c:"#5aa0ff",m:"ar-dispatch"},
  scenario_call:{c:"#e8833a",m:"ar-scenario"},
  port_call:{c:"#7fc97f",m:"ar-port"},
  table:{c:"#bb9af7",m:"ar-table"},
  tests:{c:"#c9a86a",m:"ar-tests",dash:"4,4"},
  uses:{c:"#9a9aa2",m:"ar-plain",dash:"6,5"},
  depends:{c:"#9a9aa2",m:"ar-plain",dash:"6,5"},
  shared:{c:"#4c4e56",m:"ar-shared",dash:"4,6"}
};
const VALID_EDGES={
  endpoint:{scenario:"dispatch",test:"tests"},
  scenario:{scenario:"scenario_call",io:"port_call",helper:"uses",test:"tests"},
  io:{model:"table"},
  model:{},helper:{},test:{}
};
const MARKERS=[
  ["ar-dispatch","#5aa0ff"],["ar-scenario","#e8833a"],["ar-port","#7fc97f"],
  ["ar-table","#bb9af7"],["ar-tests","#c9a86a"],["ar-plain","#9a9aa2"],["ar-shared","#4c4e56"]
];
const NODE_W=230,ROW=132,TOP=56,COL={rep:40,logic:400,nested:420,io:860,model:1150};
const ZONE_ORDER=["representation","logic","io"];
const ZONE_PRIO={representation:0,logic:1,io:2,helpers:3,plan:4};
const ZONE_GAP=30,ZONE_PAD=24,ZONE_MIN_W=280,ZONE_MIN_H=110;
let G=null,byId={},mode="scenario",ovSub="grid",viewMode="view",selScenario=null,selId=null,codeState=null,scenList=[];
const nodePos=new Map();
let drag=null,justDragged=false,dragRaf=0;
const view={x:40,y:40,k:1};
let boxes={};
let edgeSrc=null,edgeDraftPath=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2600)}
function applyGraph(g){
  G=g||{};
  byId={};(G.nodes||[]).forEach(x=>byId[x.id]=x);
  scenList=(G.scenarios||[]).filter(id=>byId[id]);
  if(selScenario&&!G.scenario_paths[selScenario]){
    selScenario=scenList.find(id=>G.scenario_paths[id]&&G.scenario_paths[id].endpoint)||scenList[0]||null;
    selId=selScenario;
  }
}
async function load(){
  const r=await fetch("/api/graph");
  if(!r.ok)throw new Error("HTTP "+r.status);
  applyGraph(await r.json());
  if(!selScenario||!G.scenario_paths[selScenario]){
    selScenario=scenList.find(id=>G.scenario_paths[id]&&G.scenario_paths[id].endpoint)||scenList[0]||null;
    mode=selScenario?"scenario":"overview";
    selId=selScenario;
  }
  const hash=location.hash.slice(1);
  if(hash==="overview")mode="overview";
  else if(hash==="overview-detail"){mode="overview";ovSub="detail";}
  else if(hash.indexOf("s=")===0){
    const want=decodeURIComponent(hash.slice(2));
    if(byId[want]){selScenario=want;selId=want;mode="scenario";}
  }
  setModeButtons();
  renderAll();
  fitView();
}
function setModeButtons(){
  document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on",b.dataset.m===mode));
  const sub=$("ovSub");
  sub.style.display=mode==="overview"?"":"none";
  sub.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.s===ovSub));
  $("vView").classList.toggle("on",viewMode==="view");
  $("vEdit").classList.toggle("on",viewMode==="edit");
  $("btnSave").style.display=viewMode==="edit"?"":"none";
  $("viewLeft").style.display=viewMode==="view"?"":"none";
  $("editLeft").style.display=viewMode==="edit"?"":"none";
}
function renderAll(){renderList();renderCanvas();renderInspector();renderStats();if(viewMode==="edit")renderEditLists();}
function renderStats(){$("stats").textContent=G?`узлов ${G.nodes.length} · связей ${G.edges.length}`:"—"}
// ---------- левая панель: сценарии по endpoint'ам ----------
function scenarioGroups(){
  const groups=new Map();
  scenList.forEach(id=>{
    const p=G.scenario_paths[id]||{};
    let key,label;
    if(p.endpoint&&byId[p.endpoint]){key=p.endpoint;label=byId[p.endpoint].label;}
    else{key="";label="(без endpoint)";}
    if(!groups.has(key))groups.set(key,{label,items:[]});
    groups.get(key).items.push(id);
  });
  const order=[...(G.endpoints||[])].filter(k=>groups.has(k));
  if(groups.has(""))order.push("");
  return order.map(k=>({key:k,label:groups.get(k).label,items:groups.get(k).items}));
}
function orderedScenarioIds(){
  const out=[];
  scenarioGroups().forEach(g=>g.items.forEach(id=>out.push(id)));
  return out;
}
function originTag(n){
  if(n.origin==="user")return' <span class="tag-plan">✦ план</span>';
  if(n.origin==="stale")return' <span class="tag-stale">⊘ stale</span>';
  return"";
}
function renderList(){
  const el=$("slist");el.innerHTML="";
  if(!G)return;
  const groups=scenarioGroups();
  if(!groups.length){el.innerHTML='<p class="dim" style="padding:6px">Сценариев нет.<br>Запусти <b>studio scan</b>.</p>';return;}
  groups.forEach(g=>{
    const det=document.createElement("details");det.open=true;
    const sm=document.createElement("summary");
    const ep=g.key?byId[g.key]:null;
    const tags=ep&&ep.details&&ep.details.tags&&ep.details.tags.length?" · "+ep.details.tags.join(", "):"";
    sm.textContent=g.label+tags;det.appendChild(sm);
    g.items.forEach(id=>{
      const n=byId[id];if(!n)return;
      const item=document.createElement("div");
      item.className="sitem"+(selScenario===id?" sel":"");
      item.dataset.id=id;
      const p=G.scenario_paths[id]||{};
      item.innerHTML=`${esc(n.label)} <small>· io ${p.io_calls?p.io_calls.length:0}</small>${originTag(n)}`;
      item.onclick=()=>selectScenario(id);
      det.appendChild(item);
    });
    el.appendChild(det);
  });
}
function selectScenario(id){
  if(!byId[id])return;
  selScenario=id;selId=id;codeState=null;mode="scenario";
  setModeButtons();renderAll();fitView();
}
// ---------- Edit: палитра, списки ----------
const PALETTE_DEFAULTS={
  endpoint:{label:"GET /new",details:{http_method:"get",path:"/new",function_name:"new_endpoint",router_module:"app.api.v1.routes.new_endpoint",tags:[]},file_path:"app/api/v1/routes/new_endpoint.py"},
  scenario:{label:"new_scenario",details:{name:"new_scenario",class_name:"NewScenario",module:"app.scenarios.new_scenario",dto:null,response:null},file_path:"app/scenarios/new_scenario.py"},
  io:{label:"_db.create()",details:{method:"create",table:"",via_attr:"_db",called_from:""},file_path:""},
  model:{label:"NewTable",details:{tablename:"new_table",class_name:"NewTable",source_file:"models.py"},file_path:"models.py"},
  test:{label:"test_new",details:{test_name:"test_new",test_for_scenario:null,test_for_endpoint:null,module:"tests.test_new"},file_path:"tests/test_new.py"},
  helper:{label:"new helper",details:{role:"other",module:"app.utils.new"},file_path:"app/utils/new.py"}
};
function renderPalette(){
  const p=$("palette");p.innerHTML="";
  for(const kind of Object.keys(PALETTE_DEFAULTS)){
    const b=document.createElement("button");
    b.textContent="+ "+kind;
    b.onclick=()=>createNodeFromPalette(kind);
    p.appendChild(b);
  }
}
function nodeIdFor(n){
  // Канонический id по схеме сканера: endpoint:<file>:<func>, scenario:<file>:<class>,
  // model:<file>:<class>, test:<file>:<test>, helper:<module>, io:<scen>:<method>:<table|_>:<line>
  const d=n.details||{};
  if(n.kind==="endpoint")return`endpoint:${n.file_path}:${d.function_name||""}`;
  if(n.kind==="scenario")return`scenario:${n.file_path}:${d.class_name||""}`;
  if(n.kind==="model")return`model:${n.file_path}:${d.class_name||""}`;
  if(n.kind==="test")return`test:${n.file_path}:${d.test_name||""}`;
  if(n.kind==="helper")return`helper:${String(d.module||"").replace(/\//g,".")}`;
  if(n.kind==="io")return`io:${d.called_from||""}:${d.method||"custom"}:${d.table||"_"}:${n.line||1}`;
  return n.id;
}
function freeNodeId(id,except){
  if(id===except||!byId[id])return id;
  const m=id.match(/^(.*):(\d+)$/);
  let base=m?m[1]:id,i=m?parseInt(m[2],10)+1:2;
  while(byId[base+":"+i]&&base+":"+i!==except)i++;
  return base+":"+i;
}
function remapNodeId(oldId,newId){
  if(oldId===newId)return;
  const n=byId[oldId];if(!n)return;
  delete byId[oldId];n.id=newId;byId[newId]=n;
  if(selId===oldId)selId=newId;
  if(selScenario===oldId)selScenario=newId;
  if(nodePos.has(oldId)){nodePos.set(newId,nodePos.get(oldId));nodePos.delete(oldId);}
  (G.edges||[]).forEach(e=>{
    let touched=false;
    if(e.from_node===oldId){e.from_node=newId;touched=true;}
    if(e.to_node===oldId){e.to_node=newId;touched=true;}
    if(touched&&e.origin==="user"){
      const kind=e.kind||"uses";
      e.id=`${e.from_node}::${kind}::${e.to_node}`;
    }
  });
}
function createNodeFromPalette(kind){
  const d=PALETTE_DEFAULTS[kind];
  const details=JSON.parse(JSON.stringify(d.details));
  let filePath=d.file_path;
  if(kind==="io"){
    details.called_from=selScenario||prompt("id сценария-родителя (called_from):")||"";
    filePath="";
  }
  const layer=kind==="endpoint"||kind==="model"?"representation":kind==="scenario"?"logic":kind==="io"?"io":"";
  const node={id:"",kind,layer,label:d.label,file_path:filePath,line:1,details,origin:"user",description:"",acceptance:[],notes:"",scaffolded:false,create_file:true,append_model:kind==="model"};
  node.id=freeNodeId(nodeIdFor(node));
  saveNewNode(node);
}
async function saveNewNode(node){
  try{
    const r=await fetch("/api/plan/patch",{method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({target_id:node.id,is_edge:false,node})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    applyGraph(await r.json());
    selId=node.id;codeState=null;
    renderAll();
    if(node.kind==="io"&&!(node.details&&node.details.called_from))
      toast("IO-узел: выберите сценарий-родитель (called_from)");
    else toast(node.kind+" создан");
  }catch(e){toast("ошибка создания: "+e.message)}
}

function zoneBBoxes(){
  const acc={};
  document.querySelectorAll("#stage .node[data-zone]").forEach(el=>{
    const z=el.dataset.zone;if(!ZONE_PRIO.hasOwnProperty(z))return;
    const x=parseFloat(el.style.left)||0,y=parseFloat(el.style.top)||0;
    const w=el.offsetWidth||NODE_W,h=el.offsetHeight||60;
    const b=acc[z]||(acc[z]={x1:x,y1:y,x2:x+w,y2:y+h,n:0});
    b.x1=Math.min(b.x1,x);b.y1=Math.min(b.y1,y);
    b.x2=Math.max(b.x2,x+w);b.y2=Math.max(b.y2,y+h);b.n++;
  });
  const zones={};
  for(const z in acc){
    const b=acc[z];
    let x=b.x1-ZONE_PAD,y=b.y1-ZONE_PAD;
    let w=Math.max(ZONE_MIN_W,(b.x2-b.x1)+ZONE_PAD*2);
    let h=Math.max(ZONE_MIN_H,(b.y2-b.y1)+ZONE_PAD*2+14);
    zones[z]={x,y,w,h,n:b.n,el:null};
  }
  return zones;
}
function translateZone(zones,name,dx,dy){
  const els=document.querySelectorAll('#stage .node[data-zone="'+name+'"]');
  els.forEach(el=>{
    const nx=(parseFloat(el.style.left)||0)+dx;
    const ny=(parseFloat(el.style.top)||0)+dy;
    el.style.left=nx+"px";el.style.top=ny+"px";
    if(el.dataset.id&&nodePos.has(el.dataset.id)){nodePos.set(el.dataset.id,{x:nx,y:ny});}
  });
  if(zones[name]){zones[name].x+=dx;zones[name].y+=dy;}
}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function fitZones(){
  for(let iter=0;iter<50;iter++){
    const zones=zoneBBoxes();
    let moved=false;
    for(let i=0;i<ZONE_ORDER.length;i++){
      for(let j=i+1;j<ZONE_ORDER.length;j++){
        const na=ZONE_ORDER[i],nb=ZONE_ORDER[j];
        const a=zones[na],b=zones[nb];
        if(!a||!b||!overlap(a,b))continue;
        const movable=ZONE_PRIO[nb]>ZONE_PRIO[na]?nb:na;
        const fixed=movable===nb?na:nb;
        const fz=zones[fixed],mz=zones[movable];
        const fcx=fz.x+fz.w/2,mcx=mz.x+mz.w/2;
        let dx=0;
        if(mcx>=fcx)dx=(fz.x+fz.w+ZONE_GAP)-mz.x;
        else dx=(fz.x-mz.w-ZONE_GAP)-mz.x;
        translateZone(zones,movable,dx,0);
        moved=true;
      }
    }
    for(const low of ["helpers","plan"]){
      const hz=zones[low];
      if(!hz)continue;
      for(const name of ZONE_ORDER){
        const c=zones[name];if(!c||!overlap(c,hz))continue;
        const dy=(c.y+c.h+ZONE_GAP)-hz.y;
        translateZone(zones,low,0,dy);
        moved=true;
      }
    }
    if(zones.helpers&&zones.plan&&overlap(zones.helpers,zones.plan)){
      const dy=(zones.helpers.y+zones.helpers.h+ZONE_GAP)-zones.plan.y;
      translateZone(zones,"plan",0,dy);
      moved=true;
    }
    if(!moved)break;
  }
  renderZoneDivs();
}

function anchor(a,b){

  }
  return dy>=0?{x1:ax,y1:a.y+a.h,x2:bx,y2:b.y-6,h:false}:{x1:ax,y1:a.y,x2:bx,y2:b.y+b.h+6,h:false};

function applyView(){
  const v=$("view");if(v)v.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;
  const z=$("zoomLabel");if(z)z.textContent=Math.round(view.k*100)+"%";
}
function toWorld(cx,cy){
  const r=$("canvas").getBoundingClientRect();
  return[(cx-r.left-view.x)/view.k,(cy-r.top-view.y)/view.k];
}
function zoomAt(cx,cy,f){
  const r=$("canvas").getBoundingClientRect();
  const px=cx-r.left,py=cy-r.top;
  const k2=Math.min(2.5,Math.max(.25,view.k*f)),s=k2/view.k;
  view.x=px-(px-view.x)*s;view.y=py-(py-view.y)*s;view.k=k2;applyView();
}
function zoomCenter(f){const r=$("canvas").getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f)}
function fitView(){
  const els=[...document.querySelectorAll("#stage .node,#stage .badge,#stage .colhead,#stage .zone")];
  if(!els.length)return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  els.forEach(el=>{
    const x=parseFloat(el.style.left)||0,y=parseFloat(el.style.top)||0;
    x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x+el.offsetWidth);y1=Math.max(y1,y+el.offsetHeight);
  });
  const c=$("canvas");
  const k=Math.min(2,Math.max(.25,Math.min((c.clientWidth-70)/Math.max(1,x1-x0),(c.clientHeight-70)/Math.max(1,y1-y0))));
  view.k=k;view.x=(c.clientWidth-(x1-x0)*k)/2-x0*k;view.y=(c.clientHeight-(y1-y0)*k)/2-y0*k;
  applyView();
}

  const n=byId[selId];const det=n.details||{};
  let extra="";
  if(n.kind==="endpoint")extra=rows([["method",det.http_method],["path",det.path],["tags",det.tags],["function",det.function_name],["router",det.router_module]]);
  if(n.kind==="scenario")extra=rows([["name",det.name],["class",det.class_name],["dto",det.dto],["response",det.response],["module",det.module]]);
  if(n.kind==="io")extra=rows([["method",det.method],["table",det.table],["via",det.via_attr],["сценарий",det.called_from]]);
  if(n.kind==="model")extra=rows([["tablename",det.tablename],["class",det.class_name],["file",det.source_file]]);
  if(n.kind==="test")extra=rows([["test_name",det.test_name],["test_for_scenario",det.test_for_scenario],["test_for_endpoint",det.test_for_endpoint],["module",det.module]]);
  if(n.kind==="helper")extra=rows([["role",det.role],["module",det.module]]);
  let doc="";
  if(n.description)doc=`<div class="docblock"><div class="dhdr">описание</div>${esc(n.description)}</div>`;
  let code="";
  if(codeState){
    code=`<div class="codewrap"><div class="codehd"><span>${esc(codeState.path)}${codeState.line?": "+codeState.line:""}</span><button id="bCloseCode">закрыть</button></div><pre id="codePre">${esc(codeState.code)}</pre></div>`;
  }
  if(viewMode==="view"){
    d.innerHTML=rows([["kind",n.kind],["label",n.label],["origin",n.origin],["file",n.file_path],["line",n.line]])+extra+doc+
      `<button id="bCode">code view</button>`+code;
    $("bCode").onclick=()=>openCode(n);
  }else{
    let form=`<div class="edit-form">`;
    form+=`<label>label</label><input id="fLabel" value="${esc(n.label)}">`;
    form+=`<label>description</label><textarea id="fDesc" rows="4">${esc(n.description)}</textarea>`;
    form+=`<label>acceptance</label><div id="fAcc">`;
    (n.acceptance||[]).forEach((a,i)=>{
      form+=`<div class="acc-row"><input data-acc="${i}" value="${esc(a)}"><button data-delacc="${i}">×</button></div>`;
    });
    form+=`</div><button id="bAddAcc" style="margin-top:4px;font-size:11px;padding:2px 6px">+ добавить</button>`;
    form+=`<label>notes</label><input id="fNotes" value="${esc(n.notes)}">`;
    if(n.origin==="user"){
      form+=`<label>file_path</label><input id="fPath" value="${esc(n.file_path)}">`;
      form+=`<label><input type="checkbox" id="fCreateFile" ${n.create_file?"checked":""}> создать файл</label>`;
      if(n.kind==="model")form+=`<label><input type="checkbox" id="fAppendModel" ${n.append_model?"checked":""}> append в models.py</label>`;
      if(n.kind==="endpoint"){
        form+=`<label>http_method</label><select id="fMethod">${["get","post","put","delete","patch"].map(m=>`<option ${det.http_method===m?"selected":""}>${m}</option>`).join("")}</select>`;
        form+=`<label>path</label><input id="fPath2" value="${esc(det.path||"")}">`;
        form+=`<label>function_name (часть id)</label><input id="fFuncName" value="${esc(det.function_name||"")}">`;
      }
      if(n.kind==="scenario"){
        form+=`<label>name</label><input id="fName" value="${esc(det.name||"")}">`;
        form+=`<label>class_name (часть id)</label><input id="fScenClass" value="${esc(det.class_name||"")}">`;
        form+=`<label>dto</label><input id="fDto" value="${esc(det.dto||"")}">`;
        form+=`<label>response</label><input id="fResp" value="${esc(det.response||"")}">`;
      }
      if(n.kind==="io"){
        form+=`<label>method</label><select id="fIoMethod">${["create","read","update","delete","query","custom"].map(m=>`<option ${det.method===m?"selected":""}>${m}</option>`).join("")}</select>`;
        form+=`<label>table</label><input id="fTable" value="${esc(det.table||"")}">`;
      }
      if(n.kind==="model"){
        form+=`<label>tablename</label><input id="fTablename" value="${esc(det.tablename||"")}">`;
        form+=`<label>class_name</label><input id="fClassName" value="${esc(det.class_name||"")}">`;
      }
      if(n.kind==="test"){
        const scenOptions=Object.values(byId).filter(x=>x.kind==="scenario").map(x=>`<option value="${esc(x.id)}" ${det.test_for_scenario===x.id?"selected":""}>${esc(x.label)}</option>`).join("");
        form+=`<label>test_for_scenario</label><select id="fTestScen"><option value="">—</option>${scenOptions}</select>`;
        form+=`<label>test_name (часть id)</label><input id="fTestName" value="${esc(det.test_name||"")}">`;
      }
      if(n.kind==="helper"){
        form+=`<label>role</label><select id="fRole">${["schema","dependency","exception","settings","utils","other"].map(r=>`<option ${det.role===r?"selected":""}>${r}</option>`).join("")}</select>`;
        form+=`<label>module (часть id)</label><input id="fModule" value="${esc(det.module||"")}">`;
      }
      if(n.kind==="io"){
        form+=`<label>called_from (id сценария, часть id)</label><input id="fCalledFrom" value="${esc(det.called_from||"")}">`;
      }
    }
    form+=`</div>`;
    let btnHtml="";
    if(n.origin==="user")btnHtml+=`<button id="bDelNode">Удалить узел</button>`;
    else if(n.origin==="code")btnHtml+=`<button id="bMarkStale">Удалить узел</button>`;
    else if(n.origin==="stale")btnHtml+=`<button id="bRestore">Восстановить узел</button>`;
    btnHtml+=`<button id="bCode">code view</button>`;
    d.innerHTML=rows([["kind",n.kind],["origin",n.origin],["file",n.file_path],["line",n.line]])+extra+doc+form+btnHtml+code;
    $("bCode").onclick=()=>openCode(n);
    $("bAddAcc").onclick=()=>{
      n.acceptance=n.acceptance||[];n.acceptance.push("");
      renderInspector();
    };
    document.querySelectorAll("[data-delacc]").forEach(b=>{
      b.onclick=()=>{n.acceptance.splice(parseInt(b.dataset.delacc),1);renderInspector()};
    });
    const saveBtn=document.createElement("button");
    saveBtn.id="bSaveDesc";saveBtn.textContent="Сохранить описание";saveBtn.style.marginRight="8px";
    saveBtn.onclick=()=>saveNodePatch(n);
    d.insertBefore(saveBtn,d.querySelector("#bCode"));
    if($("bDelNode"))$("bDelNode").onclick=()=>deleteNode(n);
    if($("bMarkStale"))$("bMarkStale").onclick=()=>markStale(n);
    if($("bRestore"))$("bRestore").onclick=()=>restoreNode(n);
  }
  if($("bCloseCode"))$("bCloseCode").onclick=()=>{codeState=null;renderInspector()};
  if(codeState){
    const pre=$("codePre");
    if(pre&&codeState.line)pre.scrollTop=Math.max(0,(codeState.line-5)*15);
  }
}
async function openCode(n){
  try{
    const r=await fetch("/api/file?path="+encodeURIComponent(n.file_path));
    const j=await r.json();
    codeState={path:n.file_path,line:n.line,code:j.code||"(файл не найден)"};
  }catch(e){codeState={path:n.file_path,line:n.line,code:"ошибка: "+e.message}}
  renderInspector();
}
async function saveNodePatch(n){
  const oldId=n.id;
  const fields={
    label:$("fLabel")?.value??n.label,
    description:$("fDesc")?.value??n.description,
    acceptance:(n.acceptance||[]).filter(a=>String(a).trim()!==""),
    notes:$("fNotes")?.value??n.notes,
  };
  const body={target_id:oldId,is_edge:false,patch:fields};
  if(n.origin==="user"){
    if($("fPath"))n.file_path=$("fPath").value;
    if($("fCreateFile"))n.create_file=$("fCreateFile").checked;
    if($("fAppendModel"))n.append_model=$("fAppendModel").checked;
    if($("fMethod"))n.details.http_method=$("fMethod").value;
    if($("fPath2"))n.details.path=$("fPath2").value;
    if($("fFuncName"))n.details.function_name=$("fFuncName").value;
    if($("fName"))n.details.name=$("fName").value;
    if($("fScenClass"))n.details.class_name=$("fScenClass").value;
    if($("fDto"))n.details.dto=$("fDto").value||null;
    if($("fResp"))n.details.response=$("fResp").value||null;
    if($("fIoMethod"))n.details.method=$("fIoMethod").value;
    if($("fTable"))n.details.table=$("fTable").value||null;
    if($("fCalledFrom"))n.details.called_from=$("fCalledFrom").value;
    if($("fTablename"))n.details.tablename=$("fTablename").value;
    if($("fClassName"))n.details.class_name=$("fClassName").value;
    if($("fRole"))n.details.role=$("fRole").value;
    if($("fTestName"))n.details.test_name=$("fTestName").value;
    if($("fModule"))n.details.module=$("fModule").value;
    if($("fTestScen"))n.details.test_for_scenario=$("fTestScen").value||null;
    n.label=fields.label;n.description=fields.description;n.acceptance=fields.acceptance;n.notes=fields.notes;
    // id зависит от file_path/идентичности — пересобираем и переименовываем патч.
    const newId=freeNodeId(nodeIdFor(n),oldId);
    if(newId!==oldId)remapNodeId(oldId,newId);
    body.target_id=newId;
    body.node=n;
    body.patch=Object.assign({file_path:n.file_path,create_file:n.create_file,append_model:n.append_model},fields);
  }
  try{
    const r=await fetch("/api/plan/patch",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok)throw new Error("HTTP "+r.status);
    applyGraph(await r.json());
    if(body.target_id!==oldId){
      const r2=await fetch("/api/plan/patch?target_id="+encodeURIComponent(oldId)+"&is_edge=0",{method:"DELETE"});
      if(r2.ok)applyGraph(await r2.json());
    }
    renderAll();toast("сохранено");
  }catch(e){toast("ошибка: "+e.message)}
}
async function deleteNode(n){
  if(!confirm("Удалить узел "+n.label+"?"))return;
  try{
    const r=await fetch("/api/plan/patch?target_id="+encodeURIComponent(n.id)+"&is_edge=0",{method:"DELETE"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    applyGraph(await r.json());
    selId=null;renderAll();toast("узел удалён");
  }catch(e){toast("ошибка: "+e.message)}
}
async function markStale(n){
  if(!confirm("Пометить "+n.label+" на удаление?"))return;
  try{
    const patch={target_id:n.id,is_edge:false,mark_removed:true};
    const r=await fetch("/api/plan/patch",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(patch)});
    if(!r.ok)throw new Error("HTTP "+r.status);
    applyGraph(await r.json());
    renderAll();toast("помечен на удаление");
  }catch(e){toast("ошибка: "+e.message)}
}
async function restoreNode(n){
  try{
    const patch={target_id:n.id,is_edge:false,mark_removed:false};
    const r=await fetch("/api/plan/patch",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(patch)});
    if(!r.ok)throw new Error("HTTP "+r.status);
    applyGraph(await r.json());
    renderAll();toast("восстановлен");
  }catch(e){toast("ошибка: "+e.message)}
}
// ---------- рисование связей ----------
async function onPortClick(nodeId,pos){
  if(!edgeSrc){
    edgeSrc={id:nodeId,pos};
    document.querySelectorAll("#stage .node").forEach(el=>{if(el.dataset.id===nodeId)el.classList.add("edge-src")});
    toast("выберите целевой узел");
    return;
  }
  if(edgeSrc.id===nodeId){clearEdgeSrc();return;}
  const fromNode=byId[edgeSrc.id];const toNode=byId[nodeId];
  if(!fromNode||!toNode){clearEdgeSrc();return;}
  const valid=VALID_EDGES[fromNode.kind];
  if(!valid||!valid[toNode.kind]){toast("недопустимая связь: "+fromNode.kind+" → "+toNode.kind);clearEdgeSrc();return;}
  const kind=valid[toNode.kind];
  let label="";
  if(kind==="dispatch")label=`run("${toNode.details?.name||toNode.label}")`;
  else if(kind==="scenario_call")label=`run("${toNode.details?.name||toNode.label}")`;
  else if(kind==="port_call")label=`_db.${toNode.details?.method||""}(${toNode.details?.table||""})`;
  else if(kind==="table")label="";
  else if(kind==="tests")label="tests";
  else label="";
  const edge={id:`${edgeSrc.id}::${kind}::${nodeId}`,from_node:edgeSrc.id,to_node:nodeId,kind,label,line:1,origin:"user",description:""};
  clearEdgeSrc();
  try{
    const r=await fetch("/api/plan/patch",{method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({target_id:edge.id,is_edge:true,edge})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    applyGraph(await r.json());
    renderAll();toast("связь создана");
  }catch(e){toast("ошибка связи: "+e.message)}
}
function clearEdgeSrc(){
  edgeSrc=null;edgeDraftPath=null;
  document.querySelectorAll("#stage .node").forEach(el=>el.classList.remove("edge-src"));
}
// ---------- Save / Scaffold ----------
async function onSave(){
  try{
    const r=await fetch("/api/scaffold/preview",{method:"POST"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const data=await r.json();
    const ops=data.ops||[];const models=data.models||[];
    const created=ops.filter(o=>o.action==="create");
    const updated=ops.filter(o=>o.action==="update_docstring");
    const skipped=ops.filter(o=>o.action.startsWith("skip"));
    let html=`<h3>Будут созданы файлы (${created.length}):</h3>`;
    created.forEach(o=>{html+=`<div class="msec"><span class="item">${esc(o.path)}</span> (${esc(byId[o.node_id]?.label||o.node_id)})</div>`});
    html+=`<h3>Будут обновлены существующие скелеты (${updated.length}):</h3>`;
    updated.forEach(o=>{html+=`<div class="msec"><span class="item">${esc(o.path)}</span></div>`});
    html+=`<h3>Будут дописаны в models.py (${models.length}):</h3>`;
    models.forEach(m=>{html+=`<div class="msec"><span class="item">${esc(m.class_name)}</span> (${esc(m.tablename)})</div>`});
    html+=`<h3>Пропущены (${skipped.length}):</h3>`;
    skipped.forEach(o=>{html+=`<div class="msec"><span class="item">${esc(o.path)}</span> — ${esc(o.reason)}</div>`});
    html+=`<div class="modal-btns"><button id="mCancel">Отмена</button><button id="mApply">Создать ${created.length} файлов</button></div>`;
    $("modalBox").innerHTML=html;$("modal").style.display="flex";
    $("mCancel").onclick=()=>{$("modal").style.display="none"};
    $("mApply").onclick=async()=>{
      $("modal").style.display="none";
      const r2=await fetch("/api/scaffold/apply",{method:"POST"});
      if(r2.ok){
        const res=await r2.json();
        applyGraph(await(await fetch("/api/graph")).json());
        renderAll();
        toast(`scaffold: ${res.created} создано, ${res.updated} обновлено, ${res.skipped} пропущено`);
      }
    };
  }catch(e){toast("ошибка: "+e.message)}
}
// ---------- события ----------
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;
  if(mode==="scenario"&&!selScenario)selScenario=scenList[0]||null;
  setModeButtons();renderCanvas();renderInspector();fitView();
});
document.querySelectorAll("#ovSub button").forEach(b=>b.onclick=()=>{
  ovSub=b.dataset.s;
  setModeButtons();renderCanvas();renderInspector();fitView();
});
$("vView").onclick=()=>{viewMode="view";setModeButtons();renderAll();fitView()};
$("vEdit").onclick=()=>{viewMode="edit";setModeButtons();renderAll();fitView()};
$("zIn").onclick=()=>zoomCenter(1.2);
$("zOut").onclick=()=>zoomCenter(1/1.2);
$("zFit").onclick=fitView;
$("zReset").onclick=()=>{view.k=1;applyView()};
$("btnSave").onclick=onSave;
let panDrag=null;
$("canvas").addEventListener("mousedown",e=>{
  if(e.button!==0)return;
  const nodeEl=e.target.closest(".node[data-id]");
  if(nodeEl&&!nodeEl.classList.contains("ghost")){
    const id=nodeEl.dataset.id;
    const nx=parseFloat(nodeEl.style.left)||0,ny=parseFloat(nodeEl.style.top)||0;
    drag={id,el:nodeEl,sx:e.clientX,sy:e.clientY,ox:nx,oy:ny,moved:false};
    e.preventDefault();e.stopPropagation();
    return;
  }
  if(e.target.closest(".badge"))return;
  panDrag={sx:e.clientX,sy:e.clientY,ox:view.x,oy:view.y};
  $("canvas").classList.add("grabbing");e.preventDefault();
});
document.addEventListener("mousemove",e=>{
  if(drag){
    const dx=(e.clientX-drag.sx)/view.k,dy=(e.clientY-drag.sy)/view.k;
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<4)return;
    if(!drag.moved){drag.moved=true;drag.el.classList.add("dragging");}
    const nx=drag.ox+dx,ny=drag.oy+dy;
    drag.el.style.left=nx+"px";drag.el.style.top=ny+"px";
    nodePos.set(drag.id,{x:nx,y:ny});
    scheduleDragRender();
    return;
  }
  if(!panDrag)return;
  view.x=panDrag.ox+e.clientX-panDrag.sx;view.y=panDrag.oy+e.clientY-panDrag.sy;applyView();
});
document.addEventListener("mouseup",()=>{
  if(drag){
    if(drag.moved){justDragged=true;drag.el.classList.remove("dragging");fitZones();drawEdges();sizeStage();}
    drag=null;
    return;
  }
  if(panDrag){panDrag=null;$("canvas").classList.remove("grabbing")}
});
function scheduleDragRender(){
  if(dragRaf)return;
  dragRaf=requestAnimationFrame(()=>{
    dragRaf=0;
    fitZones();measure();drawEdges();sizeStage();
  });
}
$("canvas").addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:1/1.12)},{passive:false});
$("canvas").addEventListener("click",e=>{
  if(justDragged){justDragged=false;return;}
  const el=e.target.closest(".node[data-id]");
  if(!el)return;
  const n=byId[el.dataset.id];if(!n)return;
  if(mode==="overview"){
    if(n.kind==="scenario"){selectScenario(n.id);return;}
    selId=n.id;codeState=null;renderCanvas();renderInspector();return;
  }
  if(n.kind==="scenario"&&n.id!==selScenario){selectScenario(n.id);return;}
  selId=n.id;codeState=null;renderCanvas();renderInspector();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(codeState){codeState=null;renderInspector();return;}
    if(edgeSrc){clearEdgeSrc();return;}
    selId=null;renderCanvas();renderInspector();
  }
});
$("btnExport").onclick=e=>{
  e.stopPropagation();
  const m=$("exportMenu");
  m.style.display=m.style.display==="none"?"block":"none";
};
document.addEventListener("click",()=>{$("exportMenu").style.display="none"});
$("expMd").onclick=()=>window.open("/api/export?format=md","_blank");
$("expJson").onclick=()=>window.open("/api/export?format=json","_blank");
