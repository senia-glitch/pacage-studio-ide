<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>studio — карта проекта</title>
<style>
:root{
  --bg:#232428;--panel:#2e2f33;--panel2:#38393e;--hdr:#1b1c1f;--line:#45464c;--txt:#d7d7db;--dim:#9a9aa2;
  --acc:#e8833a;--blue:#5aa0ff;--red:#ff5d5d;--green:#7fc97f;--purple:#bb9af7;--test:#c9a86a;
  --w:270px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 "Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--hdr);display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid #000;flex-wrap:wrap}
header .logo{font-weight:700;color:var(--acc);letter-spacing:.5px}
.hgroup{display:inline-flex;align-items:center;gap:5px}
.hcat{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.seg{display:inline-flex;gap:4px;align-items:center}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;transition:border-color .12s,background-color .12s,color .12s}
button:hover{border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
button.on{background:var(--acc);border-color:var(--acc);color:#141310;font-weight:700}
#zoomLabel{min-width:46px;text-align:center;font-size:11px;color:var(--dim);cursor:pointer;user-select:none}
#zoomLabel:hover{color:var(--txt)}
#stats{color:var(--dim);font-size:11px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#3f4046;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:#55565c}
::-webkit-scrollbar-corner{background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px solid var(--acc);outline-offset:1px}
#exportSeg{position:relative}
main{flex:1;display:grid;grid-template-columns:280px 1fr 360px;min-height:0}
#left{background:var(--panel);border-right:1px solid #000;display:flex;flex-direction:column;min-height:0}
#left h3,#right h3{margin:8px 10px 4px;font-size:11px;text-transform:uppercase;color:var(--dim);letter-spacing:.6px}
.panel-legend{font-size:10px;color:var(--dim);padding:0 6px 4px}
#slist{flex:1;overflow:auto;border-top:1px solid #000;padding:4px 6px}
#slist details{margin:3px 0}
#slist summary{cursor:pointer;color:var(--dim);font-size:11px;padding:2px 4px}
.sitem{padding:3px 8px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.sitem:hover{background:var(--panel2)}
.sitem.sel{background:#4a3a28;outline:1px solid var(--acc)}
.sitem small{color:var(--dim)}
.tag-plan{color:var(--acc);font-size:10px}
.tag-stale{color:var(--dim);font-size:10px}
.method-summary{cursor:pointer;font-weight:600;font-size:11px;color:var(--txt);padding:4px;margin-top:4px}
.domain-summary{cursor:pointer;color:var(--dim);font-size:11px;padding:2px 4px 2px 14px}
.method-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
#scenSearch{width:calc(100% - 12px);margin:4px 6px 6px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:4px 8px;font-size:12px;font-family:inherit}
#scenSearch:focus{outline:none;border-color:var(--acc)}
#center{position:relative;display:flex;flex-direction:column;min-width:0}
#canvas{flex:1;position:relative;overflow:hidden;cursor:grab;min-height:0;background:#232428}
#canvas.grabbing{cursor:grabbing}
#view{transform-origin:0 0;position:absolute;left:0;top:0}
#stage{position:relative;background:radial-gradient(circle at 1px 1px,#34353b 1px,transparent 1px);background-size:22px 22px}
#edges{position:absolute;inset:0;pointer-events:none;overflow:visible}
.elab{font-size:10px;fill:#d7d7db;paint-order:stroke;stroke:#232428;stroke-width:3px;stroke-linejoin:round}
.node{position:absolute;width:var(--w);background:#313236;border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px #0008;user-select:none;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.node:hover{border-color:var(--acc);box-shadow:0 6px 20px #000c}
.node.linked{border-color:#5a6478}
.node.linked:hover{border-color:var(--acc)}
.node.sel{outline:2px solid var(--acc)}
.node.dirty{border-style:dashed;border-color:var(--acc)}
.node.nested{opacity:.55;filter:saturate(.6)}
.node.ghost{opacity:.5;border-style:dashed;cursor:default}
.node .hd{padding:6px 8px;font-weight:700;color:var(--c,#888);border-bottom:2px solid var(--c,#888);background:rgba(255,255,255,.03);border-radius:10px 10px 0 0;display:flex;gap:6px;align-items:center;min-width:0}
.node .hd .hdt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.node .hd .hdchip{flex:none;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:#c9c9d0;background:#3a3b40;border-radius:3px;padding:0 4px}
.node .mt{padding:5px 8px 6px;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .node-sec{padding:3px 8px 5px}
.node-sec-label{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:#6c6d75;margin-bottom:2px}
.node-sec-body{font-size:10.5px;color:#c2c2ca;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.35}
.ds-full{max-height:6em;overflow-y:auto}
.acc-full{max-height:5em;overflow-y:auto}
.acc-full div{position:relative;padding-left:11px}
.acc-full div:before{content:"•";position:absolute;left:2px;color:#6c6d75}
.node-sec-divider{height:1px;background:#3a3b40;margin:2px 8px}
.node .ds-more,.node .acc-more{font-size:9.5px;color:#7c7d85;font-style:italic}
.node .origtag{position:absolute;top:4px;right:6px;font-size:9px;color:#8a8b93}
.node.dragging{cursor:grabbing;box-shadow:0 8px 22px #000a;opacity:.95}
.colhead{position:absolute;font-weight:700;font-size:12px;padding:2px 12px;border-radius:6px;background:#1e1f22;border:1px solid var(--line);white-space:nowrap;color:var(--txt)}
.colhead i{font-style:normal;color:var(--dim);font-weight:400}
.zone{position:absolute;border:1px dashed #51525a;border-radius:14px;background:rgba(120,130,160,.045);pointer-events:none}
.zone .zlab{position:absolute;top:-11px;left:14px;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--dim);background:var(--bg);padding:1px 10px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.zone .zlab i{font-style:normal;font-weight:400;color:#7c7d85}
.zone.areazone .zlab{color:var(--acc);cursor:pointer;pointer-events:auto}
.zone.areazone.sel{outline:2px solid var(--acc);outline-offset:1px}
.zone.ghostzone{border-style:dotted}
.badge{position:absolute;background:#2a2b30;border:1px dashed #55565e;border-radius:16px;padding:4px 12px;font-size:11px;color:var(--dim);white-space:nowrap}
.empty{position:absolute;left:40px;top:70px;color:var(--dim);font-size:13px}
#hint{position:absolute;left:8px;bottom:6px;font-size:11px;color:#6c6d75;pointer-events:none}
#right{background:var(--panel);border-left:1px solid #000;display:flex;flex-direction:column;min-height:0}
#inspHead{padding:10px 10px 6px;border-bottom:1px solid #000}
#inspBody{flex:1;overflow:auto;padding:10px;min-height:0}
#inspFoot{padding:10px;border-top:1px solid #000;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kv{display:flex;gap:8px;align-items:baseline;margin:5px 0;font-size:12px}
.kv span{color:var(--dim);min-width:76px;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.kv b{font-weight:600;word-break:break-all}
.dim{color:var(--dim)}
.insp-heading{font-size:12px;margin-bottom:6px}
.insp-heading b{color:var(--acc)}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.chip{font-size:9.5px;padding:1px 6px;border-radius:8px;background:#3a3b40;color:#c2c2ca}
.chip.acc{background:#4a3a28;color:var(--acc)}
.edit-form label{display:block;margin:8px 0 2px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.edit-form input,.edit-form textarea,.edit-form select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:5px 8px;font-size:12px;font-family:inherit}
.edit-form textarea{resize:vertical}
.edit-form input[type=checkbox]{width:auto}
.edit-form .acc-row{display:flex;gap:4px;align-items:center;margin:2px 0}
.edit-form .acc-row input{flex:1}
.edit-form .acc-row button{padding:2px 6px;font-size:11px}
.edit-form .hintline{font-size:10.5px;color:#7c7d85;margin:2px 0}
.edit-form .oprow{display:flex;gap:6px;align-items:center;margin:4px 0}
.edit-form .oprow select,.edit-form .oprow input{font-size:11.5px}
.btn-primary{background:var(--acc);border-color:var(--acc);color:#141310;font-weight:700;width:100%;margin-top:10px;padding:7px}
.btn-danger{border-color:#7a3b3b;color:#ffb0b0}
.btn-ghost{border-color:var(--line)}
.docblock{margin:8px 0;padding:8px 10px;border-left:3px solid var(--acc);background:#2a2b30;border-radius:0 8px 8px 0;font-size:12px;color:#c7c8ce;white-space:pre-wrap;overflow:auto;line-height:1.5}
.docblock .dhdr{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:5px}
.docblock.code{border-left-color:#4c4e56;font-style:italic;color:#84858d}
.codewrap{margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.codehd{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 8px;background:var(--panel2);font-size:11px;color:var(--dim)}
.codehd button{padding:1px 7px;font-size:11px}
#codePre{margin:0;padding:8px;background:#1e1f22;color:#d7d7db;font:11px/15px Consolas,monospace;max-height:420px;overflow:auto;white-space:pre}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#111;border:1px solid var(--acc);color:var(--txt);padding:8px 14px;border-radius:8px;display:none;z-index:99}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:100}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:640px;width:92%;max-height:82vh;overflow:auto}
.modal-box h3{margin:0 0 12px;color:var(--acc)}
.modal-box .msec{margin:10px 0;font-size:12px}
.modal-box .msec b{color:var(--dim)}
.modal-box .item{padding:2px 0;font-size:12px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
main.edit-only{grid-template-columns:1fr 380px}
main.edit-only #left{display:none}
.diff-file{margin:8px 0}
.diff-path{font-size:11px;color:var(--dim);padding:2px 0}
.diff-body{margin:0;padding:8px;background:#1e1f22;font:11px/15px Consolas,monospace;max-height:320px;overflow:auto;white-space:pre}
.diff-add{color:#7fc97f;background:#1f3a1f}
.diff-del{color:#ff5d5d;background:#3a1f1f}
.diff-hunk{color:#bb9af7}
.diff-header{color:#9a9aa2}
.diff-ctx{color:#b8b8c0}
.linkrow{cursor:pointer;color:var(--blue);font-size:11.5px;padding:1px 0}
.linkrow:hover{text-decoration:underline}
</style>
</head>
<body>
<header>
<span class="logo">⬢ studio</span>
<span class="hgroup"><span class="hcat">Режим</span><span class="seg">
<button id="mView" class="on" title="просмотр карты: только чтение">Просмотр</button>
<button id="mEdit" title="конструктор: мастер создания нового сценария">Конструктор</button>
</span></span>
<span class="hgroup" id="pathModeGroup"><span class="hcat">Вид</span><span class="seg">
<button data-pm="scenario" class="on" title="путь одного запроса: HTTP → сценарий → база → модель">Сценарий</button>
<button data-pm="overview" title="все сценарии, сгруппированные по HTTP-методу и домену">Обзор</button>
</span></span>
<span class="hgroup"><span class="hcat">На узлах</span><span class="seg" id="contentSeg">
<button id="btnDesc" class="on" title="показывать описание на узлах">Описание</button>
<button id="btnAcc" class="on" title="показывать критерии приёмки на узлах">Критерии</button>
</span></span>
<span class="hgroup"><span class="hcat">Масштаб</span><span class="seg">
<button id="zOut" title="отдалить">−</button>
<span id="zoomLabel" title="вписать карту в окно">100%</span>
<button id="zIn" title="приблизить">+</button>
<button id="zFit" title="вписать карту в окно">вписать</button>
<button id="zReset" title="масштаб 100%">1:1</button>
</span></span>
<span style="flex:1"></span>
<span class="hgroup"><span class="hcat">Действия</span><span class="seg" id="exportSeg">
<button id="btnExport" title="экспорт карты: Markdown / JSON / буфер обмена">Экспорт ▾</button>
<div id="exportMenu" style="display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;z-index:50">
<button id="expMd" style="display:block;width:100%;text-align:left;border:none;background:none;padding:4px 8px">Markdown</button>
<button id="expJson" style="display:block;width:100%;text-align:left;border:none;background:none;padding:4px 8px">JSON</button>
<button id="expCopy" style="display:block;width:100%;text-align:left;border:none;background:none;padding:4px 8px">Копировать Markdown</button>
</div>
</span></span>
<button id="btnRescan" title="пересканировать код проекта (план сохранится)">Обновить из кода</button>
<button id="btnSavePlan" style="display:none" title="сохранить несохранённые правки (Ctrl+S)">Сохранить</button>
<button id="btnFiles" style="display:none" title="создать файлы-скелеты по плану (scaffold)">Создать файлы</button>
<button id="btnClearPlan" style="display:none" title="удалить .studio/plan.json — созданные сценарии и их связи исчезнут (код не меняется)">Очистить план</button>
<span id="stats">—</span>
</header>
<main id="main">
<div id="left">
<h3>Сценарии</h3>
<input id="scenSearch" type="search" placeholder="поиск сценариев…" autocomplete="off" title="фильтр по названию, классу, домену и HTTP-методу">
<div class="panel-legend">группировка: HTTP-метод → домен</div>
<div id="slist"></div>
</div>
<div id="center">
<div id="canvas"><div id="view"><div id="stage"><svg id="edges"></svg></div></div>
<div id="hint">фон — панорама · колесо — зум · клик по узлу — инспектор · Esc — снять выделение</div>
</div>
</div>
<div id="right">
<div id="inspHead"><h3 style="margin:0">Инспектор</h3><div id="inspChips" class="chips"></div></div>
<div id="inspBody"></div>
<div id="inspFoot"></div>
</div>
</main>
<div id="toast"></div>
<div id="modal"><div class="modal-box" id="modalBox"></div></div>
<script>
"use strict";
const KIND_COLORS={endpoint:"#5aa0ff",scenario:"#e8833a",io:"#7fc97f",model:"#bb9af7",test:"#c9a86a",helper:"#9a9aa2"};
const KIND_NAMES={endpoint:"эндпоинт",scenario:"сценарий",io:"операция БД",model:"модель",test:"тест",helper:"помощник"};
const ROLE_NAMES={schema:"схема",dependency:"зависимость",exception:"исключение",settings:"настройки",utils:"утилита",other:"прочее"};
const ORIGIN_NAMES={code:"из кода",user:"план",stale:"помечен на удаление"};
const IO_METHODS=["create","read","update","delete","query","custom"];
const HTTP_METHODS=["get","post","put","patch","delete"];
const METHOD_ORDER=["get","post","put","patch","delete"];
const METHOD_LABELS={get:"GET",post:"POST",put:"PUT",patch:"PATCH",delete:"DELETE"};
const METHOD_COLORS={get:"#5aa0ff",post:"#7fc97f",put:"#e8833a",patch:"#bb9af7",delete:"#ff5d5d","без метода":"#9a9aa2"};
const NO_METHOD="без метода";
const NO_DOMAIN="без домена";
const EDGE_STYLE={
  dispatch:{c:"#5aa0ff",m:"ar-dispatch"},
  scenario_call:{c:"#e8833a",m:"ar-scenario"},
  port_call:{c:"#7fc97f",m:"ar-port"},
  table:{c:"#bb9af7",m:"ar-table"},
  tests:{c:"#c9a86a",m:"ar-tests",dash:"4,4"},
  uses:{c:"#9a9aa2",m:"ar-plain",dash:"6,5"},
  depends:{c:"#9a9aa2",m:"ar-plain",dash:"6,5"},
  shared:{c:"#4c4e56",m:"ar-shared",dash:"4,6"}
};
const MARKERS=[["ar-dispatch","#5aa0ff"],["ar-scenario","#e8833a"],["ar-port","#7fc97f"],["ar-table","#bb9af7"],["ar-tests","#c9a86a"],["ar-plain","#9a9aa2"],["ar-shared","#4c4e56"]];
const LS={desc:"studio.showDescription",acc:"studio.showAcceptance"};
const COLW=300,GAPX=66,GAPY=26,PADX=26,PADTOP=30;

let G=null,byId={},scenList=[];
let viewMode="view",pathMode="scenario",selScenario=null,selId=null;
let showDesc=true,showAcc=true,scenFilter="";
const nodePos=new Map();
function posKey(){return viewMode==="edit"?"edit":(pathMode==="scenario"?"sc:"+(selScenario||""):"overview")}
const drafts=new Map();
let wizard=null;
let codeState=null;
let drag=null,panDrag=null,justDragged=false,dragRaf=0;
const view={x:40,y:40,k:1};
let boxes={};
let colAnchors=[];

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2800)}
function msg(e){const m=e&&e.message?String(e.message):"";return m.indexOf("404")!==-1?m+" — сервер не поддерживает операцию. Обновите пакет (pip install --upgrade \"git+https://github.com/senia-glitch/pacage-studio-ide.git\") и перезапустите studio dev":m}

/* ---------- данные ---------- */
function applyGraph(g){
  G=g||{};byId={};(G.nodes||[]).forEach(x=>byId[x.id]=x);
  scenList=(G.scenarios||[]).filter(id=>byId[id]);
  if(selId&&!byId[selId])selId=null;
  if(selScenario&&!byId[selScenario])selScenario=null;
}
function isArea(id){const n=byId[id];return !!n&&n.kind==="endpoint"&&n.origin==="user"}
function areaOfView(n){return n&&n.area&&byId[n.area]?n.area:""}
function nodeDisplay(n){const d=drafts.get(n.id);return d?Object.assign({},n,d):n}
function viewNode(id){const n=byId[id];return n?nodeDisplay(n):null}
function draftDirty(id){return drafts.has(id)}
function anyDirty(){return drafts.size>0}
function viewForm(n){
  return {description:String(n.description||""),domain:String(n.domain||"")};
}
const dtoStr=v=>v===null||v===undefined||String(v).trim()===""?"":String(v);
function setViewDraft(id,vals){
  const n=byId[id];if(!n)return;
  if(JSON.stringify(viewForm(n))===JSON.stringify(vals))drafts.delete(id);
  else drafts.set(id,vals);
  updateDirtyUI();updateNodePreview(id);
}
function clearDraft(id){if(drafts.delete(id)){updateDirtyUI();updateNodePreview(id)}}

/* ---------- API ---------- */
async function api(path,method="GET",body){
  const opts={method,headers:{}};
  if(body!==undefined){opts.headers["Content-Type"]="application/json";opts.body=JSON.stringify(body)}
  const r=await fetch(path,opts);
  if(!r.ok){
    let text="";try{text=await r.text()}catch(_){}
    const err=new Error(text||("HTTP "+r.status));err.status=r.status;throw err;
  }
  return r.json();
}
async function setGraphFrom(response){applyGraph(response);if(selScenario&&!byId[selScenario]){selScenario=null}updateDirtyUI();renderAll()}
async function putNodePatch(payload){
  const g=await api("/api/plan/patch","PUT",payload);await setGraphFrom(g);return g;
}
async function putEdge(edge){
  const g=await api("/api/plan/patch","PUT",{target_id:edge.id,is_edge:true,edge});await setGraphFrom(g);return g;
}

/* ---------- id узлов (как в сканере) ---------- */
function nodeIdFor(n){
  const d=n.details||{};
  if(n.kind==="endpoint")return`endpoint:${n.file_path}:${d.function_name||""}`;
  if(n.kind==="scenario")return`scenario:${n.file_path}:${d.class_name||""}`;
  if(n.kind==="model")return`model:${n.file_path}:${d.class_name||""}`;
  if(n.kind==="test")return`test:${n.file_path}:${d.test_name||""}`;
  if(n.kind==="helper")return`helper:${String(d.module||"").replace(/\//g,".")}`;

function freeId(id,except){

/* ---------- левая панель: сценарии ---------- */
function methodOfScenario(id){
  const methods=new Set();
  (G.edges||[]).forEach(e=>{
    if(e.kind==="dispatch"&&e.to_node===id){
      const m=byId[e.from_node]?.details?.http_method;
      if(m)methods.add(String(m).toLowerCase());
    }
  });
  return methods.size?[...methods]:[NO_METHOD];
}
function domainOfScenario(id){const d=(byId[id]?.domain||"").trim();return d||NO_DOMAIN}
function scenarioGroupsByMethodDomain(filterFn){
  const groups=new Map();
  scenList.forEach(id=>{
    if(!byId[id]||byId[id].origin==="stale")return;
    const methods=methodOfScenario(id),domain=domainOfScenario(id),shared=methods.length>1;
    methods.forEach(m=>{
      if(filterFn&&!filterFn({id,method:m,domain}))return;
      if(!groups.has(m))groups.set(m,new Map());
      const byDom=groups.get(m);
      if(!byDom.has(domain))byDom.set(domain,[]);
      byDom.get(domain).push({id,shared});
    });
  });
  const ordered=[];
  METHOD_ORDER.forEach(m=>{if(groups.has(m))ordered.push([m,groups.get(m)])});
  if(groups.has(NO_METHOD))ordered.push([NO_METHOD,groups.get(NO_METHOD)]);
  ordered.forEach(([m,byDom])=>{
    const sorted=[...byDom.keys()].sort((a,b)=>{
      if(a===NO_DOMAIN)return 1;if(b===NO_DOMAIN)return -1;return a.localeCompare(b);
    });
    const out=new Map();sorted.forEach(d=>out.set(d,byDom.get(d)));byDom.clear();out.forEach((v,k)=>byDom.set(k,v));
  });
  return ordered;
}
function matchesFilter(id,method,domain){
  if(!scenFilter)return true;
  const n=byId[id];if(!n)return false;
  const hay=[n.label,n.details?.name,n.details?.class_name,domain,METHOD_LABELS[method]||method].filter(Boolean).map(s=>String(s).toLowerCase());
  return hay.some(s=>s.indexOf(scenFilter)!==-1);
}
function originTag(n){

  if(n.origin==="stale")return' <span class="tag-stale">⊘ удалён</span>';
  return"";
}

function layoutScenario(stage){

  const ioY={};let ioT=y0;
  [...new Set(p.io_calls||[])].forEach(id=>{if(!isVis(id))return;const e=addNode(stage,id,cx.io,ioT,{zone:"io"});ioY[id]=ioT;ioT+=h(e)+GAPY});
  const plans=[];const placed=new Set();

function orderScenarios(a,b,areaId){
  const edge=id=>G.edges.find(e=>e.from_node===areaId&&e.to_node===id);
  const la=edge(a.id)?1:2,lb=edge(b.id)?1:2;
  return la-lb||a.label.localeCompare(b.label);
}
function orderIo(a,b,areaId){
  const ca=a.details&&a.details.called_from,cb=b.details&&b.details.called_from;
  if(ca!==cb)return ca?-1:1;

function stack(stage,top,left,zone,items){
  let y=top;
  items.forEach(n=>{
    const e=addNode(stage,n.id,parseFloat(left),y,{zone});
    if(e){y+=e.offsetHeight+GAPY}else y+=150;

function gridZone(stage,ids,x0,y0,zone,cols=5,spacing=300){
  let rowTop=y0,rowMax=0;
  ids.forEach((id,i)=>{
    const e=addNode(stage,id,x0+(i%cols)*spacing,rowTop,{zone});

    if((i+1)%cols===0||i===ids.length-1){rowTop+=rowMax;rowMax=0}

/* ---------- связи ---------- */
function edgeList(){
  const out=[];
  if(!G)return out;
  const visible=id=>!!boxes[id];
  const full=!(viewMode==="edit")&&pathMode==="scenario";
  G.edges.forEach(e=>{
    if(!visible(e.from_node)||!visible(e.to_node))return;
    if(viewMode==="edit"){out.push(e);return}
    if(!full){if(e.kind==="scenario_call")out.push(e);return}
    if(e.kind==="scenario_call"||["dispatch","port_call","table","uses","depends","tests"].includes(e.kind))out.push(e);
  });
  if(!full&&viewMode!=="edit"){
    sharedModels().forEach(mid=>{
      scenList.forEach(sid=>{
        const p=G.scenario_paths[sid];
        if(!p)return;
        if((p.models||[]).includes(mid)){
          out.push({from_node:sid,to_node:"shared:"+mid,kind:"shared",label:""});
        }
      });
    });
  }
  return out;
}
function anchor(a,b){
  const ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2,dx=bx-ax,dy=by-ay;
  if(Math.abs(dx)>=Math.abs(dy))return dx>=0?{x1:a.x+a.w,y1:ay,x2:b.x-6,y2:by,h:true}:{x1:a.x,y1:ay,x2:b.x+b.w+6,y2:by,h:true};
  return dy>=0?{x1:ax,y1:a.y+a.h,x2:bx,y2:b.y-6,h:false}:{x1:ax,y1:a.y,x2:bx,y2:b.y+b.h+6,h:false};
}
function edgeLabel(e){
  if(e.kind==="tests")return"тест";

function drawEdges(){
  const svg=$("edges");
  let defs="<defs>"+MARKERS.map(([id,c])=>`<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join("")+"</defs>";
  const body=edgeList().map(e=>{
    const a=boxes[e.from_node],b=boxes[e.to_node];
    if(!a||!b)return"";
    const st=EDGE_STYLE[e.kind]||EDGE_STYLE.uses,s=anchor(a,b);
    const d=s.h?`M${s.x1},${s.y1} C${(s.x1+s.x2)/2},${s.y1} ${(s.x1+s.x2)/2},${s.y2} ${s.x2},${s.y2}`:`M${s.x1},${s.y1} C${s.x1},${(s.y1+s.y2)/2} ${s.x2},${(s.y1+s.y2)/2} ${s.x2},${s.y2}`;
    const mx=(s.x1+s.x2)/2,my=(s.y1+s.y2)/2-5;
    const hi=!selId||e.from_node===selId||e.to_node===selId;
    const op=e.origin==="stale"?0.4:(selId&&!hi?0.15:1);
    const label=edgeLabel(e)?`<text class="elab" x="${mx}" y="${my}" text-anchor="middle" opacity="${op}">${esc(edgeLabel(e))}</text>`:"";
    const dash=e.origin==="user"?' stroke-dasharray="6,4"':"";
    return `<path d="${d}" fill="none" stroke="${st.c}" stroke-width="1.7" opacity="${op}"${st.dash?` stroke-dasharray="${st.dash}"`:""}${dash} marker-end="url(#${st.m})"/>${label}`;
  }).join("");
  svg.innerHTML=defs+body;
}

function applyView(){const v=$("view");if(v)v.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;const z=$("zoomLabel");if(z)z.textContent=Math.round(view.k*100)+"%"}
function toWorld(cx,cy){const r=$("canvas").getBoundingClientRect();return[(cx-r.left-view.x)/view.k,(cy-r.top-view.y)/view.k]}
function zoomAt(cx,cy,f){const r=$("canvas").getBoundingClientRect();const px=cx-r.left,py=cy-r.top;const k2=Math.min(2.5,Math.max(.25,view.k*f)),s=k2/view.k;view.x=px-(px-view.x)*s;view.y=py-(py-view.y)*s;view.k=k2;applyView()}
function zoomCenter(f){const r=$("canvas").getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f)}
function fitView(){
  const els=[...document.querySelectorAll("#stage .node,#stage .badge,#stage .colhead,#stage .zone")];
  if(!els.length)return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  els.forEach(e=>{const x=parseFloat(e.style.left)||0,y=parseFloat(e.style.top)||0;x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x+(e.offsetWidth||270));y1=Math.max(y1,y+(e.offsetHeight||60))});
  const c=$("canvas");
  const k=Math.min(2,Math.max(.25,Math.min((c.clientWidth-70)/Math.max(1,x1-x0),(c.clientHeight-70)/Math.max(1,y1-y0))));
  view.k=k;view.x=(c.clientWidth-(x1-x0)*k)/2-x0*k;view.y=(c.clientHeight-(y1-y0)*k)/2-y0*k;applyView();
}

async function createScenarioFlow(o){
  let areaId=o.area;
  const created=[];
  try{
    if(o.http){
      const fn=newSlug(o.path).replace(/^_+/,"")||"new_endpoint";
      const file=`app/api/v1/routes/${fn}.py`;
      const ep={id:"",kind:"endpoint",layer:"representation",label:`${o.method.toUpperCase()} ${o.path}`,
        file_path:file,line:1,details:{http_method:o.method,path:o.path,function_name:fn,router_module:"app.api.v1.routes."+fn,tags:[]},
        origin:"user",description:o.desc,acceptance:o.acc.split("\n").map(s=>s.trim()).filter(Boolean),
        notes:"",domain:o.domain,area:"",scaffolded:false,create_file:o.withFile,append_model:false};
      ep.id=freeId(nodeIdFor(ep));
      await putNodePatch({target_id:ep.id,is_edge:false,node:ep});
      created.push({target_id:ep.id,is_edge:false});
      areaId=ep.id;
    }
    const file=`app/scenarios/${slug(o.name)}.py`;
    const scen={id:"",kind:"scenario",layer:"logic",label:o.label,file_path:file,line:1,
      details:{name:o.name,class_name:o.className,module:"app.scenarios."+slug(o.name),dto:null,response:null},
      origin:"user",description:o.desc,acceptance:o.acc.split("\n").map(s=>s.trim()).filter(Boolean),
      notes:"",domain:o.domain,area:areaId,scaffolded:false,create_file:o.withFile,append_model:false};
    scen.id=freeId(nodeIdFor(scen));
    await putNodePatch({target_id:scen.id,is_edge:false,node:scen});
    created.push({target_id:scen.id,is_edge:false});
    if(areaId){await putEdge({id:`${areaId}::dispatch::${scen.id}`,from_node:areaId,to_node:scen.id,kind:"dispatch",label:`run("${o.name}")`,line:1,origin:"user",description:""});created.push({target_id:`${areaId}::dispatch::${scen.id}`,is_edge:true})}
    for(let i=0;i<o.ops.length;i++){
      const op=o.ops[i];const table=String(op.table||"").trim();
      const io={id:"",kind:"io",layer:"io",label:table?`_db.${op.method}(${table})`:`_db.${op.method}()`,file_path:"",line:5+i,
        details:{method:op.method,table:table||null,via_attr:"_db",called_from:scen.id},
        origin:"user",description:"",acceptance:[],notes:"",domain:"",area:areaId,scaffolded:false,create_file:true,append_model:false};
      io.id=freeId(nodeIdFor(io));
      await putNodePatch({target_id:io.id,is_edge:false,node:io});
      created.push({target_id:io.id,is_edge:false});
      await putEdge({id:`${scen.id}::port_call::${io.id}`,from_node:scen.id,to_node:io.id,kind:"port_call",
        label:io.label,line:io.line,origin:"user",description:""});
      created.push({target_id:`${scen.id}::port_call::${io.id}`,is_edge:true});
      if(table){
        const modelId=Object.keys(byId).find(k=>byId[k].kind==="model"&&String(byId[k].details.tablename||"")===table);
        if(modelId){await putEdge({id:`${io.id}::table::${modelId}`,from_node:io.id,to_node:modelId,kind:"table",label:"",line:1,origin:"user",description:""});created.push({target_id:`${io.id}::table::${modelId}`,is_edge:true})}
        else{
          const cls=pascal(slug(table));
          const model={id:"",kind:"model",layer:"io",label:cls,file_path:"models.py",line:1,
            details:{tablename:table,class_name:cls,source_file:"models.py"},
            origin:"user",description:"",acceptance:[],notes:"",domain:o.domain,area:areaId,scaffolded:false,create_file:false,append_model:true};
          model.id=freeId(nodeIdFor(model));
          await putNodePatch({target_id:model.id,is_edge:false,node:model});
          created.push({target_id:model.id,is_edge:false});
          await putEdge({id:`${io.id}::table::${model.id}`,from_node:io.id,to_node:model.id,kind:"table",label:"",line:1,origin:"user",description:""});
          created.push({target_id:`${io.id}::table::${model.id}`,is_edge:true});
        }
      }
    }
    selScenario=scen.id;selId=scen.id;codeState=null;
    viewMode="view";pathMode="scenario";
    setModeButtons();renderAll();fitView();
    return areaId;
  }catch(e){
    for(let i=created.length-1;i>=0;i--){
      const c=created[i];
      try{
        await api("/api/plan/patch?target_id="+encodeURIComponent(c.target_id)+"&is_edge="+(c.is_edge?1:0),"DELETE");
      }catch(_){}
    }
    try{applyGraph(await api("/api/graph"))}catch(_){}
    renderAll();
    toast("ошибка создания: "+msg(e)+(created.length?" — созданные узлы откачены":""));
    return null;
  }
}

async function guardLeave(){
  if(!anyDirty())return true;
  const choice=await modal("Есть несохранённые правки","Узлов с несохранёнными изменениями: "+drafts.size+". Что сделать?",
    ["Сохранить и продолжить","Не сохранять","Остаться"]);
  if(choice==="Сохранить и продолжить"){await saveDraft();return true}
  if(choice==="Не сохранять"){drafts.clear();updateDirtyUI();return true}
  return false;
}
function updateDirtyUI(){
  const d=$("btnSavePlan");
  d.style.display=anyDirty()?"":"none";
  if(anyDirty())d.textContent="Сохранить"+(drafts.size>1?" ("+drafts.size+")":"");
  document.querySelectorAll("#stage .node").forEach(e=>{
    e.classList.toggle("dirty",drafts.has(e.dataset.id));
  });
  const chip=$("inspChips");
  if(chip){
    let c=chip.querySelector(".chip.draft-chip");
    if(selId&&drafts.has(selId)){
      if(!c){c=document.createElement("span");c.className="chip acc draft-chip";c.textContent="не сохранено";chip.appendChild(c)}
    }else if(c){c.remove()}
  }
}
/* ---------- модальные окна ---------- */
function modal(title,text,buttons){
  return new Promise(resolve=>{
    const box=$("modalBox");
    box.innerHTML=`<h3>${esc(title)}</h3><div class="msec">${esc(text)}</div><div class="modal-btns"></div>`;
    const btns=box.querySelector(".modal-btns");
    const cancel=buttons.find(b=>b==="Отмена"||b==="Остаться")||buttons[buttons.length-1]||null;
    let done=false;
    const close=label=>{
      if(done)return;done=true;
      document.removeEventListener("keydown",onEsc,true);
      $("modal").removeEventListener("click",onBackdrop);
      $("modal").style.display="none";resolve(label);
    };
    const onEsc=e=>{if(e.key==="Escape"){e.preventDefault();e.stopPropagation();close(cancel)}};
    const onBackdrop=e=>{if(e.target===$("modal"))close(cancel)};
    buttons.forEach(b=>{
      const elx=document.createElement("button");elx.textContent=b;
      if(b==="Отмена"||b==="Остаться")elx.className="btn-ghost";
      elx.onclick=()=>close(b);
      btns.appendChild(elx);
    });
    $("modal").style.display="flex";
    document.addEventListener("keydown",onEsc,true);
    $("modal").addEventListener("click",onBackdrop);
    const last=btns.children[btns.children.length-1];if(last)last.focus();
  });
}

    if(total)html+=`<button id="mApply" class="btn-primary" style="width:auto;margin:0">Создать ${created.length} файлов</button>`;

document.addEventListener("mouseup",e=>{
  if(drag){
    if(drag.moved){justDragged=true;drag.el.classList.remove("dragging");renderCanvas()}
    drag=null;return;
  }
  if(panDrag){panDrag=null;$("canvas").classList.remove("grabbing")}
});
function scheduleDragRender(){
  if(dragRaf)return;
  dragRaf=requestAnimationFrame(()=>{
    dragRaf=0;
    if(!drag||!drag.el.parentElement)return;
    boxes[drag.id]={x:parseFloat(drag.el.style.left)||0,y:parseFloat(drag.el.style.top)||0,w:drag.el.offsetWidth,h:drag.el.offsetHeight};
    if(viewMode==="edit")areaZoneDivs();else renderZoneDivs();
    alignColheads();
    drawEdges();sizeStage();
  });
}
$("canvas").addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:1/1.12)},{passive:false});
$("canvas").addEventListener("auxclick",e=>{e.preventDefault()});
$("canvas").addEventListener("dblclick",e=>{if(!e.target.closest(".node"))fitView()});
$("zoomLabel").onclick=fitView;
$("canvas").addEventListener("click",e=>{
  if(justDragged){justDragged=false;return}
  if(viewMode==="edit")return;
  const elx=e.target.closest(".node[data-id]");
  if(!elx){selectNode(null);return}
  const n=byId[elx.dataset.id];if(!n)return;
  if(pathMode==="overview"){if(n.kind==="scenario")selectScenario(n.id);else selectNode(n.id);return}
  if(n.kind==="scenario"&&n.id!==selScenario){selectScenario(n.id);return}
  selectNode(n.id);
});
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  const inField=tag==="input"||tag==="textarea"||tag==="select"||e.target.isContentEditable;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();saveDraft();return}
  if(!inField&&(e.key==="+"||e.key==="=")){e.preventDefault();zoomCenter(1.2);return}
  if(!inField&&e.key==="-"){e.preventDefault();zoomCenter(1/1.2);return}
  if(!inField&&e.key==="0"){e.preventDefault();view.k=1;applyView();return}
  if(e.key==="Escape"){
    if($("modal").style.display==="flex"){$("modal").style.display="none";return}
    if(codeState){codeState=null;renderInspector();return}
    if(inField)return;
    selectNode(null);
  }
});
window.addEventListener("beforeunload",e=>{if(anyDirty()){e.preventDefault();e.returnValue=""}});
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))$("modal").style.display="none"});
load().catch(e=>{document.body.innerHTML='<pre style="padding:20px;color:#ff5d5d">studio server недоступен: '+esc(e.message)+'</pre>'});
</script>
</body>
</html>
