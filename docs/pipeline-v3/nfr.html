<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ограничения и НФТ</title><style>html,body{margin:0;background:#fff}svg{display:block;width:100%;max-width:1100px;margin:0 auto;font-family:'Segoe UI',system-ui,Arial,sans-serif}</style></head><body><svg viewBox="0 0 960 645" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><text x="30" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#222">Ограничения и нефункциональные требования</text><rect x="30" y="70" width="170" height="84" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="115.0" y="107.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Границы системы</text><text x="115.0" y="127.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">что входит, что нет</text><rect x="240" y="70" width="300" height="84" rx="10" fill="#fff" stroke="#333" stroke-width="2.6"/><text x="390.0" y="107.0" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Ограничения и</text><text x="390.0" y="128.0" font-size="16" font-weight="700" text-anchor="middle" fill="#222">нефункциональные требования</text><rect x="580" y="70" width="200" height="84" rx="10" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.8"/><text x="680.0" y="98.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Конституция</text><text x="680.0" y="118.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">границы + ограничения</text><text x="680.0" y="135.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">+ словарь</text><rect x="820" y="70" width="110" height="84" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="875.0" y="107.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">ТЗ агента</text><text x="875.0" y="127.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">всегда внутри</text><path d="M200,112 L240,112" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M540,112 L580,112" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M780,112 L820,112" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="30" y="176" width="900" height="108" rx="10" fill="#f6f6f2" stroke="#bbb" stroke-width="1.2"/><text x="46" y="198" font-size="14" font-weight="700" text-anchor="start" fill="#333">Темы чек-листа</text><rect x="151.5" y="208" width="178" height="26" rx="13" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="240.5" y="226" font-size="13" font-weight="400" text-anchor="middle" fill="#222">Технологии и платформа</text><rect x="341.5" y="208" width="129" height="26" rx="13" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="406.0" y="226" font-size="13" font-weight="400" text-anchor="middle" fill="#222">Доступ по ролям</text><rect x="482.5" y="208" width="171" height="26" rx="13" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="568.0" y="226" font-size="13" font-weight="400" text-anchor="middle" fill="#222">Безопасность и данные</text><rect x="665.5" y="208" width="143" height="26" rx="13" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="737.0" y="226" font-size="13" font-weight="400" text-anchor="middle" fill="#222">Объёмы и скорость</text><rect x="260.5" y="244" width="150" height="26" rx="13" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="335.5" y="262" font-size="13" font-weight="400" text-anchor="middle" fill="#222">Среда и надёжность</text><rect x="422.5" y="244" width="143" height="26" rx="13" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="494.0" y="262" font-size="13" font-weight="400" text-anchor="middle" fill="#222">Интерфейс и языки</text><rect x="577.5" y="244" width="122" height="26" rx="13" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="638.5" y="262" font-size="13" font-weight="400" text-anchor="middle" fill="#222">Нормы и законы</text><text x="30" y="312" font-size="14" font-weight="400" text-anchor="start" fill="#333">• Заполняется закрытыми вопросами по чек-листу; значения по умолчанию уже есть — править необязательно.</text><text x="30" y="333" font-size="14" font-weight="400" text-anchor="start" fill="#333">• Часть задаёт сама студия (стек, Windows): вы только подтверждаете.</text><text x="30" y="354" font-size="14" font-weight="400" text-anchor="start" fill="#333">• Каждое ограничение измеримо и имеет критерий приёмки: «страница открывается за 2 с при 1000 записей».</text><text x="30" y="375" font-size="14" font-weight="400" text-anchor="start" fill="#333">• Изменение — запрос на изменение: затронутое перепроверяется.</text><text x="30" y="426" font-size="18" font-weight="700" text-anchor="start" fill="#222">Где проверяется</text><rect x="30" y="442" width="215" height="92" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="137.5" y="474.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Приёмка схемы БД</text><text x="137.5" y="494.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">персональные данные,</text><text x="137.5" y="511.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">хранение и сроки</text><rect x="258" y="442" width="215" height="92" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="365.5" y="474.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Приёмка интерфейса</text><text x="365.5" y="494.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">доступность, языки,</text><text x="365.5" y="511.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">устройства</text><rect x="486" y="442" width="215" height="92" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="593.5" y="474.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Приёмка бэкенда</text><text x="593.5" y="494.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">права по ролям (тесты),</text><text x="593.5" y="511.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">безопасность, объём</text><rect x="714" y="442" width="215" height="92" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="821.5" y="474.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Итоговая приёмка</text><text x="821.5" y="494.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">скорость и нагрузка</text><text x="821.5" y="511.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">на реальных данных</text><text x="30" y="568" font-size="14" font-weight="400" text-anchor="start" fill="#333">Права доступа: код строит матрицу «роль × действие» из сценариев, вы подтверждаете;</text><text x="30" y="588" font-size="14" font-weight="400" text-anchor="start" fill="#333">на этапе 4 она становится тестами («роль без права получает отказ»).</text><text x="30" y="618" font-size="15" font-weight="700" text-anchor="start" fill="#b45309">Конституция проекта входит в каждое ТЗ автоматически — агент не может её «забыть».</text></svg></body></html>
