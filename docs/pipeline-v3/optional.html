<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Волны, стиль, ТЗ</title><style>html,body{margin:0;background:#fff}svg{display:block;width:100%;max-width:1100px;margin:0 auto;font-family:'Segoe UI',system-ui,Arial,sans-serif}</style></head><body><svg viewBox="0 0 960 716" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><text x="30" y="36" font-size="25" font-weight="700" text-anchor="start" fill="#222">Пункты 14–16 — по желанию</text><rect x="30" y="52" width="900" height="190" rx="14" fill="#f6f6f2" stroke="#555" stroke-width="1.8"/><text x="46" y="78" font-size="17" font-weight="700" text-anchor="start" fill="#222">14 · Волны (по умолчанию выключены: один пакет = всё)</text><rect x="46" y="128" width="150" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="121.0" y="153.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Сценарии</text><text x="121.0" y="174.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">принятые</text><rect x="232" y="128" width="180" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="322.0" y="145.0" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Пакеты</text><text x="322.0" y="166.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">код группирует:</text><text x="322.0" y="183.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">общие сущности</text><rect x="448" y="128" width="190" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="543.0" y="153.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Этап 3 → Этап 4</text><text x="543.0" y="174.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">для одного пакета</text><polygon points="740,116.0 825.0,158 740,200.0 655.0,158" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="740" y="156" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Ещё волна?</text><text x="740" y="174" font-size="13" font-weight="400" text-anchor="middle" fill="#333"></text><rect x="850" y="128" width="70" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="885.0" y="163.5" font-size="14" font-weight="700" text-anchor="middle" fill="#222">Этап 5</text><path d="M196,158 L232,158" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M412,158 L448,158" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M638,158 L655,158" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M825,158 L850,158" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="836" y="150" font-size="12.5" font-weight="400" text-anchor="middle" fill="#333">нет</text><path d="M740,116 L740,114 L322,114 L322,128" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="530" y="108" font-size="12.5" font-weight="400" text-anchor="middle" fill="#b45309" font-style="italic">да: следующий пакет</text><text x="46" y="224" font-size="13" font-weight="400" text-anchor="start" fill="#222">Система сама предлагает волны, если сценариев больше порога (в настройках). Каждая волна — рабочий срез.</text><rect x="30" y="256" width="900" height="170" rx="14" fill="#f6f6f2" stroke="#555" stroke-width="1.8"/><text x="46" y="282" font-size="17" font-weight="700" text-anchor="start" fill="#222">15 · Стиль и каркас — шаг 3.1, один раз (есть вариант по умолчанию)</text><rect x="46" y="320" width="200" height="72" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="146.0" y="343.0" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Стиль и каркас</text><text x="146.0" y="364.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">тема, шрифты, компоненты,</text><text x="146.0" y="381.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">меню и каркас страниц</text><rect x="290" y="326" width="100" height="60" rx="8" fill="#e8eefc" stroke="#555" stroke-width="1.4"/><text x="340" y="361" font-size="13" font-weight="600" text-anchor="middle" fill="#222">Светлая</text><rect x="402" y="326" width="100" height="60" rx="8" fill="#2b2f3a" stroke="#555" stroke-width="1.4"/><text x="452" y="361" font-size="13" font-weight="600" text-anchor="middle" fill="#fff">Тёмная</text><rect x="514" y="326" width="100" height="60" rx="8" fill="#e9efe6" stroke="#555" stroke-width="1.4"/><text x="564" y="361" font-size="13" font-weight="600" text-anchor="middle" fill="#222">Деловая</text><rect x="640" y="326" width="130" height="60" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="705.0" y="351.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Ваше решение</text><text x="705.0" y="372.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">один раз</text><rect x="800" y="326" width="120" height="60" rx="10" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.8"/><text x="860.0" y="351.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Банк</text><text x="860.0" y="372.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">в каждое ТЗ</text><path d="M246,356 L290,356" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M626,356 L640,356" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M770,356 L800,356" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="46" y="412" font-size="13" font-weight="400" text-anchor="start" fill="#222">Без него каждый агент рисует страницы по-своему. В автопилоте берётся стандартная тема студии без вопросов.</text><rect x="30" y="440" width="900" height="252" rx="14" fill="#f6f6f2" stroke="#555" stroke-width="1.8"/><text x="46" y="466" font-size="17" font-weight="700" text-anchor="start" fill="#222">16 · ТЗ из банка — шаг перед тестами и реализацией (этапы 3 и 4)</text><rect x="46" y="546" width="120" height="64" rx="10" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.8"/><text x="106.0" y="573.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Банк</text><text x="106.0" y="594.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">знаний</text><rect x="200" y="542" width="190" height="72" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="295.0" y="565.0" font-size="16" font-weight="700" text-anchor="middle" fill="#222">ТЗ из банка</text><text x="295.0" y="586.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">собирает код по связям,</text><text x="295.0" y="603.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">не агент</text><path d="M166,578 L200,578" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="430" y="488" width="190" height="24" rx="12" fill="#fff3cd" stroke="#b45309" stroke-width="1.4"/><text x="525.0" y="504.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222">Конституция</text><rect x="430" y="518" width="190" height="24" rx="12" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="525.0" y="534.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222">Требования и критерии</text><rect x="430" y="548" width="190" height="24" rx="12" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="525.0" y="564.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222">Сценарий и диаграмма</text><rect x="430" y="578" width="190" height="24" rx="12" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="525.0" y="594.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222">Часть схемы БД</text><rect x="430" y="608" width="190" height="24" rx="12" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="525.0" y="624.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222">Часть контракта</text><rect x="430" y="638" width="190" height="24" rx="12" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="525.0" y="654.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222">Стиль (для интерфейса)</text><path d="M390,578 L430,578" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="680" y="538" width="240" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="800.0" y="565.0" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Автор тестов</text><text x="800.0" y="586.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">и исполнитель получают</text><text x="800.0" y="603.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">только этот срез</text><path d="M620,578 L680,578" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="46" y="676" font-size="13" font-weight="400" text-anchor="start" fill="#222">ТЗ хранит версии записей: запись стала «устарело» — устарело и ТЗ. Меньше токенов, меньше путаницы, всё воспроизводимо.</text></svg></body></html>
