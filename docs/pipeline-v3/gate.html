<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Типовые ворота</title><style>html,body{margin:0;background:#fff}svg{display:block;width:100%;max-width:1100px;margin:0 auto;font-family:'Segoe UI',system-ui,Arial,sans-serif}</style></head><body><svg viewBox="0 0 960 916" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><text x="30" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#222">Типовые ворота — одинаковые на всех этапах</text><rect x="30" y="90" width="170" height="120" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="115.0" y="136.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Результат этапа</text><text x="115.0" y="156.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">черновик</text><text x="115.0" y="173.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">в банке знаний</text><path d="M200,150 L240,150" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="240" y="90" width="215" height="120" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="347.5" y="127.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">1 · Проверки кодом</text><text x="347.5" y="147.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">точные, без модели:</text><text x="347.5" y="164.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">тесты, связи, ключи,</text><text x="347.5" y="181.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">имена из словаря</text><path d="M455,150 L490,150" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="472" y="142" font-size="13" font-weight="400" text-anchor="middle" fill="#333">да</text><rect x="490" y="90" width="215" height="120" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="597.5" y="127.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">2 · Оценка агента</text><text x="597.5" y="147.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">другая модель, чем автор;</text><text x="597.5" y="164.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">каждый критерий 0–10,</text><text x="597.5" y="181.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">каждый должен быть ≥ 8</text><path d="M705,150 L740,150" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="722" y="142" font-size="13" font-weight="400" text-anchor="middle" fill="#333">да</text><rect x="740" y="90" width="190" height="120" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="835.0" y="127.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">3 · Ваше решение</text><text x="835.0" y="147.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">результат, оценка,</text><text x="835.0" y="164.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">замечания и карта;</text><text x="835.0" y="181.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">принять · вернуть</text><rect x="240" y="266" width="465" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="472.5" y="292.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Доработка</text><text x="472.5" y="312.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">автор получает список замечаний; не больше 3 кругов</text><text x="472.5" y="329.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">подряд — потом агент останавливается и спрашивает вас</text><path d="M347,210 L347,270" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="358" y="245" font-size="13" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">нет: код нашёл ошибку</text><path d="M597,210 L597,270" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="608" y="245" font-size="13" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">нет: оценка &lt; 8</text><path d="M780,210 L780,305 L705,305" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="790" y="262" font-size="13" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">вернуть</text><text x="790" y="278" font-size="13" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">с замечанием</text><path d="M240,305 L115,305 L115,210" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="124" y="246" font-size="13" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">автор переделывает,</text><text x="124" y="262" font-size="13" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">снова на ворота</text><rect x="30" y="392" width="900" height="70" rx="10" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.8"/><text x="480.0" y="422.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Банк знаний</text><text x="480.0" y="442.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">записи этапа получают статус «принято»; следующий этап читает только принятое</text><path d="M890,210 L890,392" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="900" y="330" font-size="13" font-weight="400" text-anchor="start" fill="#333">принять</text><text x="792" y="378" font-size="13" font-weight="400" text-anchor="end" fill="#444" font-style="italic">«принять ниже порога» — с пометкой в банке</text><text x="30" y="510" font-size="18" font-weight="700" text-anchor="start" fill="#222">Режим участия — один переключатель в настройках проекта</text><rect x="30" y="528" width="285" height="90" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="172.5" y="550.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Вручную</text><text x="172.5" y="570.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">вы решаете сами: ворота,</text><text x="172.5" y="587.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">висящее, запросы на изменение</text><text x="172.5" y="604.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">и можете остановить любой шаг</text><rect x="337" y="528" width="285" height="90" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="2.6"/><text x="479.5" y="559.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">На воротах (по умолчанию)</text><text x="479.5" y="579.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">агенты ведут этап и предлагают,</text><text x="479.5" y="596.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">вы подтверждаете на воротах</text><rect x="644" y="528" width="286" height="90" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="787.0" y="550.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Автопилот</text><text x="787.0" y="570.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">агенты решают сами (слои 1–2);</text><text x="787.0" y="587.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">вы — на итоговой приёмке</text><text x="787.0" y="604.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">и когда агент застрял</text><text x="30" y="646" font-size="14" font-weight="700" text-anchor="start" fill="#b45309">Висящее и запросы на изменение решает тот, кто ведёт режим: вы, агенты или вместе.</text><text x="30" y="666" font-size="14" font-weight="700" text-anchor="start" fill="#b45309">Откат к прежней версии записи возможен всегда.</text><text x="30" y="716" font-size="18" font-weight="700" text-anchor="start" fill="#222">Критерии каждых ворот — в Настройках студии, независимо для каждых</text><rect x="30" y="732" width="620" height="164" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="48" y="758" font-size="15" font-weight="700" text-anchor="start" fill="#222">Настройки → Ворота → Приёмка схемы БД</text><text x="48" y="790" font-size="15" font-weight="400" text-anchor="start" fill="#222">Нормализация</text><rect x="548" y="773" width="84" height="24" rx="12" fill="#fff3cd" stroke="#b45309" stroke-width="1.4"/><text x="590" y="790" font-size="14" font-weight="700" text-anchor="middle" fill="#222">≥ 8</text><text x="48" y="820" font-size="15" font-weight="400" text-anchor="start" fill="#222">Соответствие стандартам индустрии</text><rect x="548" y="803" width="84" height="24" rx="12" fill="#fff3cd" stroke="#b45309" stroke-width="1.4"/><text x="590" y="820" font-size="14" font-weight="700" text-anchor="middle" fill="#222">≥ 8</text><text x="48" y="850" font-size="15" font-weight="400" text-anchor="start" fill="#222">Расширяемость</text><rect x="548" y="833" width="84" height="24" rx="12" fill="#fff3cd" stroke="#b45309" stroke-width="1.4"/><text x="590" y="850" font-size="14" font-weight="700" text-anchor="middle" fill="#222">≥ 8</text><text x="48" y="878" font-size="14" font-weight="400" text-anchor="start" fill="#b45309">+ свой критерий</text><text x="210" y="878" font-size="14" font-weight="400" text-anchor="start" fill="#b45309">вернуть по умолчанию</text><text x="676" y="758" font-size="14" font-weight="400" text-anchor="start" fill="#333">• у каждых ворот свой список</text><text x="676" y="778" font-size="14" font-weight="400" text-anchor="start" fill="#333">• ворота пройдены, если КАЖДЫЙ</text><text x="676" y="798" font-size="14" font-weight="400" text-anchor="start" fill="#333">  критерий ≥ 8 (не среднее)</text><text x="676" y="818" font-size="14" font-weight="400" text-anchor="start" fill="#333">• порог можно менять по критерию</text><text x="676" y="838" font-size="14" font-weight="400" text-anchor="start" fill="#333">• критерий можно отключить или</text><text x="676" y="858" font-size="14" font-weight="400" text-anchor="start" fill="#333">  добавить свой</text><text x="676" y="878" font-size="14" font-weight="400" text-anchor="start" fill="#333">• по умолчанию всё уже заполнено</text></svg></body></html>
