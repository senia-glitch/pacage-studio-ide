t x="602" y="136" width="88" height="28" rx="6" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.5"/><text x="646.0" y="154.0" font-size="12" font-weight="400" text-anchor="middle" fill="#222">Записаться</text><line x1="592" y1="150" x2="602" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="602" y="212" width="88" height="28" rx="6" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.5"/><text x="646.0" y="230.0" font-size="12" font-weight="400" text-anchor="middle" fill="#222">модель Запись</text><line x1="646" y1="164" x2="646" y2="212" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="500" y="212" width="92" height="28" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3"/><text x="546.0" y="230.0" font-size="12" font-weight="400" text-anchor="middle" fill="#222">GET /doctors</text><rect x="720" y="66" width="210" height="226" rx="12" fill="#f6f6f2" stroke="#555" stroke-width="1.8"/><text x="734" y="90" font-size="12" font-weight="400" text-anchor="start" fill="#666">этап 5 и всегда</text><text x="734" y="112" font-size="16" font-weight="700" text-anchor="start" fill="#222">Карта системы</text><text x="825" y="276" font-size="12" font-weight="400" text-anchor="middle" fill="#555">от проблемы до теста</text><rect x="765" y="124" width="120" height="24" rx="6" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.5"/><text x="825.0" y="140.0" font-size="12" font-weight="400" text-anchor="middle" fill="#222">Проблема</text><rect x="765" y="158" width="120" height="24" rx="6" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.5"/><text x="825.0" y="174.0" font-size="12" font-weight="400" text-anchor="middle" fill="#222">Требование</text><rect x="765" y="192" width="120" height="24" rx="6" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.5"/><text x="825.0" y="208.0" font-size="12" font-weight="400" text-anchor="middle" fill="#222">Сценарий</text><rect x="765" y="226" width="120" height="24" rx="6" fill="#fde2e2" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/><text x="825.0" y="242.0" font-size="12" font-weight="400" text-anchor="middle" fill="#222">Тест: нет</text><line x1="825" y1="148" x2="825" y2="158" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><line x1="825" y1="182" x2="825" y2="192" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><line x1="825" y1="216" x2="825" y2="226" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah)"/><text x="30" y="326" font-size="18" font-weight="700" text-anchor="start" fill="#222">Три слоя на каждой карте</text><rect x="30" y="346" width="36" height="20" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3"/><text x="48.0" y="360.0" font-size="12" font-weight="400" text-anchor="middle" fill="#222"></text><text x="76" y="361" font-size="14" font-weight="400" text-anchor="start" fill="#333">план — из банка знаний (пунктир)</text><rect x="330" y="346" width="36" height="20" rx="6" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.5"/><text x="348.0" y="360.0" font-size="12" font-weight="400" text-anchor="middle" fill="#222"></text><text x="376" y="361" font-size="14" font-weight="400" text-anchor="start" fill="#333">факт — из кода, всё в порядке</text><rect x="630" y="346" width="36" height="20" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/><text x="648.0" y="360.0" font-size="12" font-weight="400" text-anchor="middle" fill="#222"></text><text x="676" y="361" font-size="14" font-weight="400" text-anchor="start" fill="#333">устарело — ждёт перепроверки</text><rect x="30" y="380" width="36" height="20" rx="6" fill="#fde2e2" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/><text x="48.0" y="394.0" font-size="12" font-weight="400" text-anchor="middle" fill="#222"></text><text x="76" y="395" font-size="14" font-weight="400" text-anchor="start" fill="#333">разрыв: нет теста, нет эндпоинта</text><rect x="330" y="380" width="36" height="20" rx="6" fill="#eeeeee" stroke="#888" stroke-width="1.5"/><text x="348.0" y="394.0" font-size="12" font-weight="400" text-anchor="middle" fill="#222"></text><text x="376" y="395" font-size="14" font-weight="400" text-anchor="start" fill="#333">«из кода» без описания</text><text x="30" y="440" font-size="18" font-weight="700" text-anchor="start" fill="#222">Что даёт карта</text><text x="30" y="466" font-size="14" font-weight="400" text-anchor="start" fill="#333">• Показывается на третьем слое ворот («Ваше решение») для своего этапа; общая «Карта системы» доступна всегда.</text><text x="30" y="488" font-size="14" font-weight="400" text-anchor="start" fill="#333">• Клик по узлу: почему он есть (цепочка до проблемы), что на нём держится, чем проверяется.</text><text x="30" y="510" font-size="14" font-weight="400" text-anchor="start" fill="#333">• Запрос на изменение: затронутое подсвечивается на карте ещё до вашего решения.</text><text x="30" y="532" font-size="14" font-weight="400" text-anchor="start" fill="#333">• План ≠ факт (страница есть в коде, но не в плане) — это «висящее» из пункта 2: отклонить или внедрить.</text><text x="30" y="570" font-size="14" font-weight="700" text-anchor="start" fill="#b45309">Карты строятся сами из банка и сканера кода; существующие карты студии (бэкенд, фронтенд, план и факт) остаются.</text></svg></body></html>
