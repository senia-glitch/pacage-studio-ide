<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Словарь и сценарии</title><style>html,body{margin:0;background:#fff}svg{display:block;width:100%;max-width:1100px;margin:0 auto;font-family:'Segoe UI',system-ui,Arial,sans-serif}</style></head><body><svg viewBox="0 0 960 672" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><text x="30" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#222">Этап 2 начинается со словаря и сценариев</text><rect x="30" y="70" width="140" height="84" rx="10" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.8"/><text x="100.0" y="98.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Банк знаний</text><text x="100.0" y="118.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">принятое</text><text x="100.0" y="135.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">из этапа 1</text><rect x="205" y="70" width="195" height="84" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="302.5" y="107.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Роли и словарь</text><text x="302.5" y="127.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">единый список имён</text><rect x="435" y="70" width="215" height="84" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="542.5" y="107.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Сценарии</text><text x="542.5" y="127.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">из принятых требований</text><polygon points="790,62.0 900.0,112 790,162.0 680.0,112" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="790" y="110" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Приёмка сценариев</text><text x="790" y="129" font-size="14" font-weight="400" text-anchor="middle" fill="#333">типовые ворота</text><path d="M170,112 L205,112" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M400,112 L435,112" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M650,112 L680,112" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="205" y="180" width="195" height="134" rx="10" fill="#f6f6f2" stroke="#bbb" stroke-width="1.2"/><text x="217" y="202" font-size="14" font-weight="700" text-anchor="start" fill="#333">Что в словаре</text><text x="217" y="224" font-size="14" font-weight="400" text-anchor="start" fill="#333">Роли: Пациент, Врач</text><text x="217" y="243" font-size="14" font-weight="400" text-anchor="start" fill="#333">Компоненты: Регистратура,</text><text x="217" y="262" font-size="14" font-weight="400" text-anchor="start" fill="#333">  Платёж (внешний)</text><text x="217" y="281" font-size="14" font-weight="400" text-anchor="start" fill="#333">Сущности: Запись, Приём</text><text x="217" y="300" font-size="14" font-weight="400" text-anchor="start" fill="#333">у каждого — тип и смысл</text><rect x="435" y="180" width="232" height="134" rx="10" fill="#f6f6f2" stroke="#bbb" stroke-width="1.2"/><text x="447" y="202" font-size="14" font-weight="700" text-anchor="start" fill="#333">Что в сценарии</text><text x="447" y="224" font-size="14" font-weight="400" text-anchor="start" fill="#333">цель и роли; основной ход</text><text x="447" y="243" font-size="14" font-weight="400" text-anchor="start" fill="#333">ошибки и исключения</text><text x="447" y="262" font-size="14" font-weight="400" text-anchor="start" fill="#333">диаграмма использования</text><text x="447" y="281" font-size="14" font-weight="400" text-anchor="start" fill="#333">диаграмма последовательности</text><text x="447" y="300" font-size="14" font-weight="400" text-anchor="start" fill="#333">критерии приёмки</text><rect x="680" y="180" width="250" height="134" rx="10" fill="#f6f6f2" stroke="#bbb" stroke-width="1.2"/><text x="692" y="202" font-size="14" font-weight="700" text-anchor="start" fill="#333">Критерии ворот по умолчанию</text><text x="692" y="224" font-size="14" font-weight="400" text-anchor="start" fill="#333">код: требование → сценарий;</text><text x="692" y="243" font-size="14" font-weight="400" text-anchor="start" fill="#333">участники — из словаря</text><text x="692" y="262" font-size="14" font-weight="400" text-anchor="start" fill="#333">агент: полнота, ясность,</text><text x="692" y="281" font-size="14" font-weight="400" text-anchor="start" fill="#333">ошибки и исключения учтены</text><text x="30" y="340" font-size="14" font-weight="400" text-anchor="start" fill="#444">Дальше — схема БД на каждый сценарий (как на главной схеме).</text><text x="30" y="385" font-size="18" font-weight="700" text-anchor="start" fill="#222">Каждый шаг диаграммы размечен — из него рождаются БД, интерфейс и API</text><rect x="30" y="402" width="380" height="190" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="48" y="426" font-size="15" font-weight="700" text-anchor="start" fill="#222">Диаграмма последовательности (пример)</text><rect x="46" y="444" width="348" height="38" rx="8" fill="#f6f6f2" stroke="#999" stroke-width="1.2"/><text x="58" y="468" font-size="14" font-weight="400" text-anchor="start" fill="#222">Пациент → Интерфейс: выбирает время</text><path d="M394,463 L560,463" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="477" y="456" font-size="13" font-weight="700" text-anchor="middle" fill="#b45309">экран</text><rect x="560" y="441" width="370" height="44" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="745.0" y="458.5" font-size="15" font-weight="700" text-anchor="middle" fill="#222">План интерфейса · этап 3</text><text x="745.0" y="478.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">страница «Запись», выбор времени</text><rect x="46" y="496" width="348" height="38" rx="8" fill="#f6f6f2" stroke="#999" stroke-width="1.2"/><text x="58" y="520" font-size="14" font-weight="400" text-anchor="start" fill="#222">Интерфейс → Система: создать запись</text><path d="M394,515 L560,515" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="477" y="508" font-size="13" font-weight="700" text-anchor="middle" fill="#b45309">вызов</text><rect x="560" y="493" width="370" height="44" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="745.0" y="510.5" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Контракт API · этап 3</text><text x="745.0" y="530.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">вызов «создать запись» → эндпоинт</text><rect x="46" y="548" width="348" height="38" rx="8" fill="#f6f6f2" stroke="#999" stroke-width="1.2"/><text x="58" y="572" font-size="14" font-weight="400" text-anchor="start" fill="#222">Система → База: сохранить запись</text><path d="M394,567 L560,567" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="477" y="560" font-size="13" font-weight="700" text-anchor="middle" fill="#b45309">данные</text><rect x="560" y="545" width="370" height="44" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="745.0" y="562.5" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Схема БД сценария · этап 2</text><text x="745.0" y="582.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">таблица «Запись»: время, врач</text><text x="30" y="625" font-size="15" font-weight="700" text-anchor="start" fill="#b45309">Участники диаграммы — только имена из словаря. Новое имя после принятия — запрос на изменение.</text><text x="30" y="647" font-size="14" font-weight="400" text-anchor="start" fill="#333">Каждое принятое требование входит минимум в один сценарий (проверяет код).</text></svg></body></html>
