<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Связи записей</title><style>html,body{margin:0;background:#fff}svg{display:block;width:100%;max-width:1100px;margin:0 auto;font-family:'Segoe UI',system-ui,Arial,sans-serif}</style></head><body><svg viewBox="0 0 960 838" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><text x="30" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#222">Цепочка связей — родитель указывается при создании записи</text><rect x="35" y="80" width="170" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="120.0" y="110.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Проблема</text><text x="120.0" y="130.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">этап 1</text><rect x="275" y="80" width="170" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="360.0" y="110.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Требование</text><text x="360.0" y="130.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">этап 1</text><rect x="515" y="80" width="170" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="600.0" y="110.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Сценарий</text><text x="600.0" y="130.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">этап 2</text><rect x="755" y="80" width="170" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="840.0" y="110.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Таблица БД</text><text x="840.0" y="130.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">этап 2</text><path d="M205,115 L275,115" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M445,115 L515,115" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M685,115 L755,115" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="275" y="200" width="170" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="360.0" y="230.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Критерий приёмки</text><text x="360.0" y="250.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">этап 1</text><rect x="515" y="200" width="170" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="600.0" y="230.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Страница</text><text x="600.0" y="250.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">этап 3</text><rect x="755" y="200" width="170" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="840.0" y="230.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Вызов API</text><text x="840.0" y="250.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">контракт, этап 3</text><path d="M360,150 L360,200" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M600,150 L600,200" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M685,235 L755,235" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="275" y="320" width="170" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="360.0" y="350.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Тест</text><text x="360.0" y="370.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">этапы 3–4</text><rect x="755" y="320" width="170" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="840.0" y="350.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Эндпоинт</text><text x="840.0" y="370.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">этап 4</text><path d="M360,270 L360,320" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M840,270 L840,320" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="35" y="190" font-size="13" font-weight="400" text-anchor="start" fill="#555" font-style="italic">каждая стрелка — «происходит из»:</text><text x="35" y="207" font-size="13" font-weight="400" text-anchor="start" fill="#555" font-style="italic">у записи всегда есть родитель</text><text x="35" y="224" font-size="13" font-weight="400" text-anchor="start" fill="#555" font-style="italic">(проблемы — из источников)</text><text x="30" y="438" font-size="18" font-weight="700" text-anchor="start" fill="#222">Что проверяет код на воротах — покрытие связей (блокирует ворота)</text><rect x="30" y="454" width="285" height="98" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="172.5" y="489.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Проверка проблем</text><text x="172.5" y="509.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">у проблемы есть источник:</text><text x="172.5" y="526.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">граница, область или конкурент</text><rect x="337" y="454" width="285" height="98" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="479.5" y="489.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Приёмка требований</text><text x="479.5" y="509.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">каждая проблема → требование</text><text x="479.5" y="526.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">каждое требование → критерий</text><rect x="644" y="454" width="285" height="98" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="786.5" y="489.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Приёмка схемы БД</text><text x="786.5" y="509.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">каждое требование → сценарий</text><text x="786.5" y="526.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">сценарий → таблицы, нет «сирот»</text><rect x="30" y="566" width="285" height="98" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="172.5" y="601.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Приёмка интерфейса</text><text x="172.5" y="621.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">каждый сценарий → страница</text><text x="172.5" y="638.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">критерий → тест; вызов → контракт</text><rect x="337" y="566" width="285" height="98" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="479.5" y="601.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Приёмка бэкенда</text><text x="479.5" y="621.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">каждый вызов → эндпоинт</text><text x="479.5" y="638.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">лишних эндпоинтов нет, тесты зелёные</text><rect x="644" y="566" width="285" height="98" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="786.5" y="601.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Итоговая приёмка</text><text x="786.5" y="621.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">цепочка от проблемы до теста</text><text x="786.5" y="638.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">без разрывов у каждой проблемы</text><rect x="30" y="690" width="900" height="92" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="480.0" y="713.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Висящее или противоречащее системе принять нельзя</text><text x="480.0" y="733.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">запись без родителя, дубль или конфликт с принятым блокирует ворота:</text><text x="480.0" y="750.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">этап отклоняет её или внедряет — привязывает к родителю, согласует с принятым</text><text x="480.0" y="767.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">кто решает — по режиму участия: вы, агенты этапа или вместе</text><text x="30" y="812" font-size="14" font-weight="400" text-anchor="start" fill="#333">Коды записей вы не набираете: связи хранятся внутри, на карте видна цепочка по названиям.</text></svg></body></html>
