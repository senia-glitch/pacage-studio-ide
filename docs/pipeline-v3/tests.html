<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Критерии и тесты</title><style>html,body{margin:0;background:#fff}svg{display:block;width:100%;max-width:1100px;margin:0 auto;font-family:'Segoe UI',system-ui,Arial,sans-serif}</style></head><body><svg viewBox="0 0 960 684" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><text x="30" y="38" font-size="24" font-weight="700" text-anchor="start" fill="#222">Критерии приёмки и тесты — до реализации (этапы 3 и 4)</text><rect x="30" y="80" width="190" height="100" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="125.0" y="107.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Критерий приёмки</text><text x="125.0" y="127.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">«Когда …, система …»</text><text x="125.0" y="144.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">пишется вместе с</text><text x="125.0" y="161.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">требованием и сценарием</text><rect x="250" y="80" width="210" height="100" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="355.0" y="107.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Автор тестов</text><text x="355.0" y="127.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">другой агент, чем исполнитель</text><text x="355.0" y="144.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">видит критерии, сценарии,</text><text x="355.0" y="161.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">контракт — но не код</text><rect x="490" y="80" width="190" height="100" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="585.0" y="107.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Красный старт</text><text x="585.0" y="127.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">без реализации тесты</text><text x="585.0" y="144.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">должны падать — иначе</text><text x="585.0" y="161.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">тест пустой</text><rect x="710" y="80" width="220" height="100" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="820.0" y="107.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Реализация агентом</text><text x="820.0" y="127.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">правит код; тесты не</text><text x="820.0" y="144.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">трогает — только через</text><text x="820.0" y="161.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">запрос на изменение</text><path d="M220,130 L250,130" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M460,130 L490,130" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M680,130 L710,130" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M870,180 L870,260" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="745" y="260" width="185" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="837.5" y="295.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Прогон тестов</text><text x="837.5" y="315.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">все тесты этапа</text><polygon points="560,250.0 665.0,300 560,350.0 455.0,300" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="560" y="298" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Зелёные?</text><text x="560" y="317" font-size="14" font-weight="400" text-anchor="middle" fill="#333">и критерии покрыты</text><path d="M745,300 L665,300" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M560,250 L560,222 L770,222 L770,180" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="572" y="215" font-size="13" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">нет: доработка кода</text><rect x="210" y="255" width="210" height="90" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="315.0" y="286.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Типовые ворота</text><text x="315.0" y="306.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">код: зелёные + покрытие;</text><text x="315.0" y="323.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">агент: качество тестов</text><path d="M455,300 L420,300" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="437" y="292" font-size="13" font-weight="400" text-anchor="middle" fill="#333">да</text><rect x="30" y="255" width="150" height="90" rx="10" fill="#fff" stroke="#333" stroke-width="1.8" stroke-dasharray="6 4"/><text x="105.0" y="295.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Критерий</text><text x="105.0" y="315.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">«глазами»</text><path d="M105,180 L105,255" fill="none" stroke="#333" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M180,300 L210,300" fill="none" stroke="#333" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="335" y="378" font-size="14" font-weight="400" text-anchor="start" fill="#444">Что тестом не проверить (вид, удобство) — в чек-лист приёмки:</text><text x="335" y="395" font-size="14" font-weight="400" text-anchor="start" fill="#444">вы или агент по скриншоту.</text><rect x="30" y="412" width="900" height="62" rx="10" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.8"/><text x="480.0" y="438.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Банк знаний</text><text x="480.0" y="458.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">раздел этапа: критерии, тесты, результаты; связь критерий → тест (пункт 2)</text><path d="M315,345 L315,412" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="30" y="504" font-size="18" font-weight="700" text-anchor="start" fill="#222">Три защиты от «работает, но не то»</text><rect x="30" y="520" width="286" height="84" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="173.0" y="548.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Тесты пишет не исполнитель</text><text x="173.0" y="568.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">иначе тест подтверждает</text><text x="173.0" y="585.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">написанное, а не нужное</text><rect x="337" y="520" width="286" height="84" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="480.0" y="548.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Красный старт</text><text x="480.0" y="568.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">тест, который проходит без кода,</text><text x="480.0" y="585.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">не принимается как пустой</text><rect x="644" y="520" width="286" height="84" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="787.0" y="548.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Исполнитель не правит тесты</text><text x="787.0" y="568.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">иначе подгонит тест под код;</text><text x="787.0" y="585.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">правка — только запросом</text><text x="30" y="636" font-size="14" font-weight="700" text-anchor="start" fill="#b45309">Так же на этапе 4 (тесты эндпоинтов из критериев и контракта) и в итоговой приёмке (сквозные сценарии).</text><text x="30" y="656" font-size="14" font-weight="400" text-anchor="start" fill="#333">Изменили критерий — запрос на изменение: связанные тесты «устарели» и перепроверяются.</text></svg></body></html>
