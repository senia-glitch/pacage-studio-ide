<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Схема студии v3</title><style>html,body{margin:0;background:#fff}svg{display:block;width:100%;max-width:1100px;margin:0 auto;font-family:'Segoe UI',system-ui,Arial,sans-serif}</style></head><body><svg viewBox="0 0 960 3976" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f8a3f"/></marker></defs><text x="30" y="36" font-size="25" font-weight="700" text-anchor="start" fill="#222">Студия: путь от идеи до работающего ПО — схема v3</text><rect x="30" y="56" width="160" height="52" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="110.0" y="77.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">1 · Идея</text><text x="110.0" y="98.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">что строим</text><path d="M190,82 L215,82" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="215" y="56" width="160" height="52" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="295.0" y="77.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">2 · Сценарии, БД</text><text x="295.0" y="98.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">сценарии и данные</text><path d="M375,82 L400,82" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="400" y="56" width="160" height="52" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="480.0" y="77.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">3 · Frontend</text><text x="480.0" y="98.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">на моках</text><path d="M560,82 L585,82" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="585" y="56" width="160" height="52" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="665.0" y="77.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">4 · Backend</text><text x="665.0" y="98.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">реальный API</text><path d="M745,82 L770,82" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="770" y="56" width="160" height="52" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="850.0" y="77.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">5 · Анализ</text><text x="850.0" y="98.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">приёмка и правки</text><path d="M850,108 L850,128 L110,128 L110,108" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="480" y="145" font-size="12.5" font-weight="400" text-anchor="middle" fill="#b45309" font-style="italic">следующая итерация — как «Запрос»</text><polygon points="42,158 54,168 42,178 30,168" fill="#fff3cd" stroke="#b45309" stroke-width="1.5"/><text x="62" y="173" font-size="13" font-weight="400" text-anchor="start" fill="#444">ворота: код → независимая оценка → ваше решение</text><rect x="402" y="159" width="26" height="18" rx="4" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.5"/><text x="436" y="173" font-size="13" font-weight="400" text-anchor="start" fill="#444">банк знаний</text><path d="M552,168 L586,168" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="594" y="173" font-size="13" font-weight="400" text-anchor="start" fill="#444">возврат на доработку</text><rect x="30" y="184" width="26" height="14" rx="4" fill="#fff" stroke="#333" stroke-width="1.5" stroke-dasharray="5 3"/><text x="62" y="196" font-size="13" font-weight="400" text-anchor="start" fill="#444">необязательный шаг</text><rect x="212" y="184" width="26" height="14" rx="4" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 3"/><text x="246" y="196" font-size="13" font-weight="400" text-anchor="start" fill="#444">волны (по желанию)</text><text x="402" y="196" font-size="13" font-weight="400" text-anchor="start" fill="#444">к банку: пунктир — «черновик», сплошная — «принято»</text><rect x="785" y="206" width="165" height="3090" rx="14" fill="#eef7ee" stroke="#3f8a3f" stroke-width="2"/><text x="793" y="232" font-size="13" font-weight="700" text-anchor="start" fill="#3f8a3f">БАНК ЗНАНИЙ</text><text x="793" y="256" font-size="12" font-weight="400" text-anchor="start" fill="#444">один на проект,</text><text x="793" y="273" font-size="12" font-weight="400" text-anchor="start" fill="#444">раздел на каждый</text><text x="793" y="290" font-size="12" font-weight="400" text-anchor="start" fill="#444">этап; хозяин раздела</text><text x="793" y="307" font-size="12" font-weight="400" text-anchor="start" fill="#444">— его этап.</text><text x="793" y="324" font-size="12" font-weight="400" text-anchor="start" fill="#444">Шаги пишут «черновик»,</text><text x="793" y="341" font-size="12" font-weight="400" text-anchor="start" fill="#444">«принято» — только</text><text x="793" y="358" font-size="12" font-weight="400" text-anchor="start" fill="#444">через ворота.</text><text x="793" y="375" font-size="12" font-weight="400" text-anchor="start" fill="#444">Жёлтое — «Конституция»:</text><text x="793" y="392" font-size="12" font-weight="400" text-anchor="start" fill="#444">входит в каждое ТЗ.</text><rect x="50" y="206" width="710" height="372" rx="16" fill="#f6f6f2" stroke="#555" stroke-width="1.8"/><text x="66" y="234" font-size="16" font-weight="700" text-anchor="start" fill="#222">Входы — система выбирает сама: есть ли код и есть ли банк</text><rect x="65" y="254" width="190" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="160.0" y="279.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Новая система</text><text x="160.0" y="300.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">папка пуста, банка нет</text><rect x="300" y="254" width="190" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="395.0" y="279.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Развитие</text><text x="395.0" y="300.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">код есть, банка нет</text><rect x="535" y="254" width="190" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="630.0" y="279.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Запрос</text><text x="630.0" y="300.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">банк есть: правка или фича</text><rect x="65" y="339" width="190" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="160.0" y="369.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Полный путь</text><text x="160.0" y="390.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">этапы 1–5, все ворота</text><path d="M160,314 L160,339" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="300" y="336" width="190" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="395.0" y="354.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Сканер + замысел</text><text x="395.0" y="375.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">сканер: страницы, эндпоинты,</text><text x="395.0" y="392.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">модели, тесты; агент</text><text x="395.0" y="409.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">восстанавливает замысел</text><path d="M395,314 L395,336" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><polygon points="630,326.0 725.0,374 630,422.0 535.0,374" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="630" y="373" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Мелкая правка?</text><text x="630" y="391" font-size="12.5" font-weight="400" text-anchor="middle" fill="#444">размер — по связям</text><path d="M630,314 L630,326" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M630,422 L630,436 L395,436 L395,458" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M630,436 L630,458" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="403" y="432" font-size="12.5" font-weight="400" text-anchor="start" fill="#333">да</text><text x="638" y="432" font-size="12.5" font-weight="400" text-anchor="start" fill="#333">нет</text><rect x="300" y="458" width="190" height="88" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="395.0" y="480.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Быстрый путь</text><text x="395.0" y="501.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">критерий → тест →</text><text x="395.0" y="518.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">реализация → ворота</text><text x="395.0" y="535.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">по области правки</text><rect x="535" y="458" width="190" height="88" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="630.0" y="487.0" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Полный путь</text><text x="630.0" y="508.0" font-size="16" font-weight="700" text-anchor="middle" fill="#222">с нужного этапа</text><text x="630.0" y="529.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">правит этап-владелец</text><text x="66" y="566" font-size="12.5" font-weight="400" text-anchor="start" fill="#333">«Развитие» после восстановления замысла дальше работает как «Запрос».</text><path d="M160,409 L160,648" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="50" y="648" width="710" height="590" rx="16" fill="#f6f6f2" stroke="#555" stroke-width="1.8"/><circle cx="100" cy="686" r="21" fill="#fff" stroke="#555" stroke-width="1.8"/><text x="100" y="694" font-size="23" font-weight="700" text-anchor="middle" fill="#222">1</text><text x="138" y="695" font-size="24" font-weight="700" text-anchor="start" fill="#222">Идея</text><rect x="65" y="748" width="190" height="66" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="160.0" y="776.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Область</text><text x="160.0" y="797.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">о чём система, для кого</text><text x="69" y="743" font-size="11" font-weight="600" text-anchor="start" fill="#888">1.1</text><rect x="300" y="748" width="190" height="66" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="395.0" y="776.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Уточняющие вопросы</text><text x="395.0" y="797.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">закрытые, по одному</text><text x="304" y="743" font-size="11" font-weight="600" text-anchor="start" fill="#888">1.2</text><rect x="535" y="748" width="190" height="66" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="630.0" y="776.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Границы системы</text><text x="630.0" y="797.5" font-size="13" font-weight="400" text-anchor="middle" fill="#444">что входит, что нет</text><text x="539" y="743" font-size="11" font-weight="600" text-anchor="start" fill="#888">1.3</text><path d="M255,781 L300,781" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M490,781 L535,781" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M630,748 L630,726 L395,726 L395,748" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="409" y="720" font-size="12.5" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">по желанию: ещё вопросы</text><path d="M630,814 L630,870" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M630,844 L160,844" fill="none" stroke="#333" stroke-width="1.8"/><path d="M395,844 L395,870" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M160,844 L160,870" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="66" y="838" font-size="12" font-weight="400" text-anchor="start" fill="#333">параллельно</text><rect x="65" y="870" width="190" height="72" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="160.0" y="893.0" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Ограничения</text><text x="160.0" y="914.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">чек-лист; значения</text><text x="160.0" y="931.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">по умолчанию уже есть</text><text x="69" y="865" font-size="11" font-weight="600" text-anchor="start" fill="#888">1.4</text><rect x="300" y="870" width="190" height="72" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="395.0" y="893.0" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Конкуренты</text><text x="395.0" y="914.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">поиск → проверка → анализ</text><text x="395.0" y="931.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">1 раз, далее по желанию</text><text x="304" y="865" font-size="11" font-weight="600" text-anchor="start" fill="#888">1.5</text><rect x="535" y="870" width="190" height="72" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="630.0" y="893.0" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Предметная область</text><text x="630.0" y="914.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">роли, сущности, процессы</text><text x="630.0" y="931.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">1 раз, далее по желанию</text><text x="539" y="865" font-size="11" font-weight="600" text-anchor="start" fill="#888">1.6</text><path d="M160,942 L160,978" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M395,942 L395,978" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M630,942 L630,978" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="65" y="978" width="660" height="84" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="395.0" y="1007.0" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Проблемы</text><text x="395.0" y="1028.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">на основе границ, предметной области и конкурентов</text><text x="395.0" y="1045.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">+ уточняющие вопросы: ответы уточняют, расширяют или сужают границы</text><text x="69" y="973" font-size="11" font-weight="600" text-anchor="start" fill="#888">1.7</text><path d="M725,1008 L742,1008 L742,781 L725,781" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><path d="M160,1062 L160,1092" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><polygon points="160,1092.0 250.0,1142 160,1192.0 70.0,1142" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="160" y="1141" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Проверка проблем</text><text x="160" y="1159" font-size="12.5" font-weight="400" text-anchor="middle" fill="#444">код · о
