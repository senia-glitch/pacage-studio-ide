<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Итоговая приёмка</title><style>html,body{margin:0;background:#fff}svg{display:block;width:100%;max-width:1100px;margin:0 auto;font-family:'Segoe UI',system-ui,Arial,sans-serif}</style></head><body><svg viewBox="0 0 960 650" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><text x="30" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#222">Итоговая приёмка — этап 5</text><rect x="30" y="70" width="150" height="200" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="105.0" y="139.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Запуск</text><text x="105.0" y="161.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">приложение с</text><text x="105.0" y="178.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">демо-данными по</text><text x="105.0" y="195.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">сценариям,</text><text x="105.0" y="212.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">одной кнопкой</text><rect x="215" y="70" width="240" height="200" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="335.0" y="122.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">1 · Проверки кодом</text><text x="335.0" y="144.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">сквозные сценарии зелёные</text><text x="335.0" y="161.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">(реальный API)</text><text x="335.0" y="178.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">все тесты этапов зелёные</text><text x="335.0" y="195.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">цепочка без разрывов</text><text x="335.0" y="212.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">нет «устарело» и «висящего»</text><text x="335.0" y="229.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">нагрузка из ограничений</text><rect x="490" y="70" width="215" height="200" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="597.5" y="131.0" font-size="17" font-weight="700" text-anchor="middle" fill="#222">2 · Независимый разбор</text><text x="597.5" y="153.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">другая модель; каждый</text><text x="597.5" y="170.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">критерий ≥ 8:</text><text x="597.5" y="187.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">соответствие идее,</text><text x="597.5" y="204.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">целостность, качество,</text><text x="597.5" y="221.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">безопасность, документация</text><rect x="740" y="70" width="190" height="200" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="835.0" y="131.0" font-size="17" font-weight="700" text-anchor="middle" fill="#222">3 · Ваша приёмка</text><text x="835.0" y="153.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">вы пробуете живое</text><text x="835.0" y="170.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">приложение; чек-лист</text><text x="835.0" y="187.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">«глазами»; замечания</text><text x="835.0" y="204.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">агентам; принять</text><text x="835.0" y="221.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">или вернуть</text><path d="M180,170 L215,170" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M455,170 L490,170" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="472" y="162" font-size="13" font-weight="400" text-anchor="middle" fill="#333">да</text><path d="M705,170 L740,170" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="722" y="162" font-size="13" font-weight="400" text-anchor="middle" fill="#333">да</text><rect x="215" y="330" width="490" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="460.0" y="356.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Замечания с адресом этапа</text><text x="460.0" y="378.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">каждое — запрос на изменение (пункт 3): правит этап-владелец,</text><text x="460.0" y="395.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">затронутое «устарело» и перепроверяется; не больше 3 кругов</text><path d="M335,270 L335,330" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="346" y="304" font-size="13" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">нет</text><path d="M597,270 L597,330" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="608" y="304" font-size="13" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">нет</text><path d="M780,270 L780,370 L705,370" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="790" y="318" font-size="13" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">вернуть</text><path d="M215,370 L105,370 L105,270" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="116" y="322" font-size="13" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">после правок —</text><text x="116" y="338" font-size="13" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">заново</text><path d="M890,270 L890,450" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="900" y="360" font-size="13" font-weight="400" text-anchor="start" fill="#333">принять</text><rect x="30" y="450" width="900" height="92" rx="10" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.8"/><text x="480.0" y="482.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Итог итерации</text><text x="480.0" y="504.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">Документация.md · актуальные схема БД и карты · контракт API (версия)</text><text x="480.0" y="521.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">отчёт: оценки, принятое ниже порога, история запросов · точка отката · номер итерации</text><text x="30" y="580" font-size="15" font-weight="700" text-anchor="start" fill="#b45309">Дальше любое желание — «Запрос» (пункт 5): следующая итерация не начинается с нуля.</text><text x="30" y="604" font-size="14" font-weight="400" text-anchor="start" fill="#333">Этап 5 сам ничего не правит: замечания уходят этапу-владельцу по связям, так срабатывает каскад.</text><text x="30" y="624" font-size="14" font-weight="400" text-anchor="start" fill="#333">В автопилоте итоговая приёмка остаётся за вами — это момент, когда вы смотрите готовую систему.</text></svg></body></html>
