<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Запрос на изменение</title><style>html,body{margin:0;background:#fff}svg{display:block;width:100%;max-width:1100px;margin:0 auto;font-family:'Segoe UI',system-ui,Arial,sans-serif}</style></head><body><svg viewBox="0 0 960 860" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><text x="30" y="38" font-size="24" font-weight="700" text-anchor="start" fill="#222">Запрос на изменение — как меняется принятое</text><rect x="30" y="110" width="190" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="125.0" y="136.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Запрос</text><text x="125.0" y="156.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">на изменение принятого</text><text x="125.0" y="173.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">вы · агент · ворота</text><rect x="260" y="110" width="190" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="355.0" y="136.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">К владельцу</text><text x="355.0" y="156.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">этап, где запись принята;</text><text x="355.0" y="173.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">новая фича — в этап 1</text><rect x="490" y="110" width="190" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="585.0" y="136.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Что затронет</text><text x="585.0" y="156.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">по связям (пункт 2):</text><text x="585.0" y="173.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">всё, что на неё опирается</text><polygon points="830,95.0 930.0,150 830,205.0 730.0,150" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="830" y="148" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Решение</text><text x="830" y="167" font-size="14" font-weight="400" text-anchor="middle" fill="#333">по режиму участия</text><path d="M220,150 L260,150" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M450,150 L490,150" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M680,150 L730,150" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="745" y="28" width="170" height="50" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="830.0" y="48.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Отклонено</text><text x="830.0" y="68.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">принятое не тронуто</text><path d="M830,95 L830,78" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="842" y="90" font-size="13" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">отклонить</text><path d="M830,205 L830,290" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="842" y="255" font-size="13" font-weight="400" text-anchor="start" fill="#333">принять</text><rect x="735" y="290" width="190" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="830.0" y="316.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Новая версия</text><text x="830.0" y="336.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">записи; старая</text><text x="830.0" y="353.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">остаётся в истории</text><rect x="490" y="290" width="190" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="585.0" y="316.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">«Устарело»</text><text x="585.0" y="336.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">затронутые записи ждут,</text><text x="585.0" y="353.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">сами не меняются</text><rect x="245" y="290" width="190" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="340.0" y="316.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Перепроверка</text><text x="340.0" y="336.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">только затронутого:</text><text x="340.0" y="353.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">свои ворота этапов</text><path d="M735,330 L680,330" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M490,330 L435,330" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="30" y="420" width="900" height="62" rx="10" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.8"/><text x="480.0" y="446.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Банк знаний</text><text x="480.0" y="466.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">перепроверенное снова «принято»; остальное не тронуто</text><path d="M340,370 L340,420" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="30" y="524" font-size="18" font-weight="700" text-anchor="start" fill="#222">Кто решает — по режиму участия</text><rect x="30" y="540" width="285" height="86" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="172.5" y="578.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Вручную</text><text x="172.5" y="598.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">решаете вы</text><rect x="337" y="540" width="285" height="86" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="479.5" y="569.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">На воротах</text><text x="479.5" y="589.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">агент оценивает влияние и</text><text x="479.5" y="606.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">предлагает; вы подтверждаете</text><rect x="644" y="540" width="286" height="86" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="787.0" y="569.5" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Автопилот</text><text x="787.0" y="589.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">независимый агент решает</text><text x="787.0" y="606.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">(слои 1–2), вы видите журнал</text><text x="30" y="672" font-size="18" font-weight="700" text-anchor="start" fill="#222">Статусы записи в банке</text><rect x="30" y="690" width="170" height="42" rx="21" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="115" y="717" font-size="15" font-weight="700" text-anchor="middle" fill="#222">черновик</text><rect x="260" y="690" width="170" height="42" rx="21" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="345" y="717" font-size="15" font-weight="700" text-anchor="middle" fill="#222">принято</text><rect x="490" y="690" width="170" height="42" rx="21" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="575" y="717" font-size="15" font-weight="700" text-anchor="middle" fill="#222">устарело</text><rect x="720" y="690" width="170" height="42" rx="21" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="805" y="717" font-size="15" font-weight="700" text-anchor="middle" fill="#222">принято, версия 2</text><path d="M200,711 L260,711" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="230.0" y="703" font-size="13" font-weight="400" text-anchor="middle" fill="#333">ворота</text><path d="M430,711 L490,711" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="460.0" y="703" font-size="13" font-weight="400" text-anchor="middle" fill="#333">запрос</text><path d="M660,711 L720,711" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="690.0" y="703" font-size="13" font-weight="400" text-anchor="middle" fill="#333">проверено</text><text x="30" y="760" font-size="15" font-weight="700" text-anchor="start" fill="#b45309">Принятое напрямую не меняется — только через запрос. Откат к прежней версии возможен всегда.</text><text x="30" y="794" font-size="14" font-weight="400" text-anchor="start" fill="#333">Пример: бэкенду не хватает поля «телефон» → запрос уходит в этап 2 (схема БД) →</text><text x="30" y="814" font-size="14" font-weight="400" text-anchor="start" fill="#333">затронуты: таблица, эндпоинт, страница, контракт, 3 теста → решает режим: вы, агенты или вместе →</text><text x="30" y="834" font-size="14" font-weight="400" text-anchor="start" fill="#333">затронутое «устарело» и перепроверяется, всё остальное остаётся принятым.</text></svg></body></html>
