<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Устройство этапа</title><style>html,body{margin:0;background:#fff}svg{display:block;width:100%;max-width:1100px;margin:0 auto;font-family:'Segoe UI',system-ui,Arial,sans-serif}</style></head><body><svg viewBox="0 0 960 712" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><text x="30" y="36" font-size="24" font-weight="700" text-anchor="start" fill="#222">Этап устроен одинаково: вход → шаги → ворота → банк</text><rect x="30" y="86" width="170" height="84" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="115.0" y="115.0" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Вход</text><text x="115.0" y="136.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">из банка —</text><text x="115.0" y="153.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">только принятое</text><rect x="240" y="86" width="210" height="84" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="345.0" y="115.0" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Шаги этапа</text><text x="345.0" y="136.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">пишут «черновик»</text><text x="345.0" y="153.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">в банк</text><rect x="490" y="86" width="170" height="84" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="575.0" y="115.0" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Ворота</text><text x="575.0" y="136.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">типовые: код,</text><text x="575.0" y="153.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">агент, вы</text><rect x="700" y="86" width="230" height="84" rx="10" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.8"/><text x="815.0" y="115.0" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Банк знаний</text><text x="815.0" y="136.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">«принято» — только</text><text x="815.0" y="153.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">через ворота</text><path d="M200,128 L240,128" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M450,128 L490,128" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M660,128 L700,128" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M575,86 L575,66 L345,66 L345,86" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="590" y="60" font-size="13" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">нет: доработка внутри этапа</text><path d="M345,170 L345,205" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><rect x="235" y="205" width="220" height="44" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="345.0" y="232.5" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Запрос на изменение</text><text x="358" y="192" font-size="13" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">находка в другом этапе</text><text x="475" y="232" font-size="13" font-weight="400" text-anchor="start" fill="#333">← пункт 3: не прыжок через границу этапов</text><text x="30" y="292" font-size="18" font-weight="700" text-anchor="start" fill="#222">Было</text><rect x="30" y="302" width="420" height="112" rx="12" fill="#f6f6f2" stroke="#555" stroke-width="1.6"/><text x="42" y="322" font-size="13" font-weight="700" text-anchor="start" fill="#555">Этап 1</text><rect x="46" y="336" width="150" height="44" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="121.0" y="362.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Функц. требования</text><rect x="296" y="336" width="140" height="44" rx="7" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.5"/><text x="366.0" y="362.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Банк знаний</text><path d="M196,358 L296,358" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="490" y="302" width="440" height="112" rx="12" fill="#f6f6f2" stroke="#555" stroke-width="1.6"/><text x="502" y="322" font-size="13" font-weight="700" text-anchor="start" fill="#555">Этап 2</text><polygon points="580,323.0 645.0,358 580,393.0 515.0,358" fill="#fff3cd" stroke="#b45309" stroke-width="1.5"/><text x="580" y="362" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Ворота 1</text><rect x="680" y="336" width="110" height="44" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="735.0" y="362.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Сценарии</text><rect x="810" y="336" width="100" height="44" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="860.0" y="362.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">…</text><path d="M436,358 L515,358" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M645,358 L680,358" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M790,358 L810,358" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M580,323 L580,312 L580,296 L240,296 L240,302" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="600" y="292" font-size="13" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">оценка &lt; 8: идея на доработку</text><text x="30" y="448" font-size="18" font-weight="700" text-anchor="start" fill="#222">Стало</text><rect x="30" y="458" width="420" height="112" rx="12" fill="#f6f6f2" stroke="#555" stroke-width="1.6"/><text x="42" y="478" font-size="13" font-weight="700" text-anchor="start" fill="#555">Этап 1</text><rect x="42" y="492" width="146" height="44" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="115.0" y="518.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Функц. требования</text><polygon points="280,478.0 365.0,514 280,550.0 195.0,514" fill="#fff3cd" stroke="#b45309" stroke-width="1.5"/><text x="280" y="518" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Приёмка требований</text><rect x="380" y="492" width="60" height="44" rx="7" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.5"/><text x="410.0" y="518.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Банк</text><path d="M188,514 L195,514" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M365,514 L380,514" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M280,550 L280,560 L115,560 L115,536" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ahr)"/><text x="292" y="566" font-size="12" font-weight="400" text-anchor="start" fill="#b45309" font-style="italic">нет: внутри этапа</text><rect x="490" y="458" width="440" height="112" rx="12" fill="#f6f6f2" stroke="#555" stroke-width="1.6"/><text x="502" y="478" font-size="13" font-weight="700" text-anchor="start" fill="#555">Этап 2</text><rect x="506" y="492" width="100" height="44" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="556.0" y="518.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Вход</text><rect x="630" y="492" width="130" height="44" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="695.0" y="518.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Роли и словарь</text><rect x="784" y="492" width="130" height="44" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="849.0" y="518.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Сценарии</text><path d="M606,514 L630,514" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M760,514 L784,514" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M440,514 L506,514" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="30" y="606" font-size="14" font-weight="400" text-anchor="start" fill="#333">• Этап читает только принятое: черновиков соседних этапов он не видит.</text><text x="30" y="627" font-size="14" font-weight="400" text-anchor="start" fill="#333">• Возврат — внутри этапа. Находка в другом этапе — запрос на изменение, а не прыжок через границу.</text><text x="30" y="648" font-size="14" font-weight="400" text-anchor="start" fill="#333">• «Проверка проблем» остаётся в этапе 1, перед требованиями; «Приёмка требований» замыкает этап 1.</text><text x="30" y="686" font-size="15" font-weight="700" text-anchor="start" fill="#b45309">Проверка согласованности и оценка из этапа 2 теперь замыкают этап 1 — критерии те же.</text></svg></body></html>
