<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Три входа</title><style>html,body{margin:0;background:#fff}svg{display:block;width:100%;max-width:1100px;margin:0 auto;font-family:'Segoe UI',system-ui,Arial,sans-serif}</style></head><body><svg viewBox="0 0 960 750" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><text x="30" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#222">Три входа в конвейер</text><rect x="30" y="70" width="200" height="84" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="130.0" y="107.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Новая система</text><text x="130.0" y="127.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">папка пуста, банка нет</text><rect x="270" y="70" width="250" height="84" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="395.0" y="107.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Развитие</text><text x="395.0" y="127.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">код есть, банка нет</text><rect x="560" y="70" width="370" height="84" rx="10" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="745.0" y="107.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Запрос</text><text x="745.0" y="127.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">банк есть: правка или новая фича</text><path d="M130,154 L130,200" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="30" y="200" width="200" height="84" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="130.0" y="237.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Полный путь</text><text x="130.0" y="257.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">этапы 1–5, все ворота</text><path d="M395,154 L395,200" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="270" y="200" width="250" height="84" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="395.0" y="228.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Сканер кода</text><text x="395.0" y="248.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">код не меняет; находит страницы,</text><text x="395.0" y="265.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">эндпоинты, модели, тесты</text><path d="M395,284 L395,345" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="270" y="345" width="250" height="110" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="395.0" y="377.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Восстановление замысла</text><text x="395.0" y="397.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">агент предлагает сценарии,</text><text x="395.0" y="414.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">требования и проблемы;</text><text x="395.0" y="431.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">подтверждение — по режиму</text><path d="M745,154 L745,197" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><polygon points="745,197.0 875.0,252 745,307.0 615.0,252" fill="#fff3cd" stroke="#b45309" stroke-width="1.8"/><text x="745" y="250" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Мелкая правка?</text><text x="745" y="269" font-size="14" font-weight="400" text-anchor="middle" fill="#333">размер — по связям</text><path d="M745,307 L745,326 L647,326 L647,345" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M745,307 L745,326 L842,326 L842,345" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="690" y="320" font-size="13" font-weight="400" text-anchor="middle" fill="#333">да</text><text x="798" y="320" font-size="13" font-weight="400" text-anchor="middle" fill="#333">нет</text><rect x="560" y="345" width="175" height="110" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="647.5" y="377.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Быстрый путь</text><text x="647.5" y="397.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">критерий → тест →</text><text x="647.5" y="414.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">реализация → ворота</text><text x="647.5" y="431.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">по области правки</text><rect x="755" y="345" width="175" height="110" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="842.5" y="376.0" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Полный путь</text><text x="842.5" y="397.0" font-size="17" font-weight="700" text-anchor="middle" fill="#222">с нужного этапа</text><text x="842.5" y="417.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">по пункту 3: меняется</text><text x="842.5" y="434.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">только затронутое</text><rect x="30" y="500" width="900" height="62" rx="10" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.8"/><text x="480.0" y="526.5" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Банк знаний</text><text x="480.0" y="546.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">после любого входа записи в банке связаны в цепочку (пункт 2)</text><path d="M130,284 L130,500" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M395,455 L395,500" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M647,455 L647,500" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M842,455 L842,500" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="30" y="598" font-size="18" font-weight="700" text-anchor="start" fill="#222">Правила</text><text x="30" y="624" font-size="14" font-weight="400" text-anchor="start" fill="#333">• Ворота при «развитии» проверяют только область правки: иначе пришлось бы описывать весь старый проект сразу.</text><text x="30" y="644" font-size="14" font-weight="400" text-anchor="start" fill="#333">• Запись «из кода» без описания менять нельзя: сначала внедрить (описать) или отклонить (предложить удалить).</text><text x="30" y="664" font-size="14" font-weight="400" text-anchor="start" fill="#333">• Быстрый путь становится полным, если затронуты схема БД, контракт или принятое требование.</text><text x="30" y="684" font-size="14" font-weight="400" text-anchor="start" fill="#333">• Путь выбирает режим участия: вручную — вы; на воротах — система предлагает, вы подтверждаете; автопилот — сама.</text><text x="30" y="724" font-size="15" font-weight="700" text-anchor="start" fill="#b45309">Итерация — это запрос на изменение, а не возврат в начало схемы.</text></svg></body></html>
