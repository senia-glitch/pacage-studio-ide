<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Варианты</title><style>html,body{margin:0;background:#fff}svg{display:block;width:100%;max-width:1100px;margin:0 auto;font-family:'Segoe UI',system-ui,Arial,sans-serif}</style></head><body><svg viewBox="0 0 960 736" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><text x="30" y="36" font-size="25" font-weight="700" text-anchor="start" fill="#222">Варианты решений — переезжают в этап 2</text><text x="30" y="70" font-size="18" font-weight="700" text-anchor="start" fill="#222">Было</text><rect x="30" y="80" width="330" height="90" rx="12" fill="#f6f6f2" stroke="#555" stroke-width="1.6"/><text x="42" y="100" font-size="13" font-weight="700" text-anchor="start" fill="#555">Этап 1</text><rect x="42" y="112" width="130" height="40" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="107.0" y="136.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Функц. требования</text><rect x="196" y="112" width="92" height="40" rx="7" fill="#fff" stroke="#333" stroke-width="1.5" stroke-dasharray="5 3"/><text x="242.0" y="136.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Варианты</text><rect x="306" y="112" width="44" height="40" rx="7" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.5"/><text x="328.0" y="136.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Банк</text><path d="M172,132 L196,132" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M288,132 L306,132" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="30" y="206" font-size="18" font-weight="700" text-anchor="start" fill="#222">Стало</text><rect x="30" y="216" width="330" height="90" rx="12" fill="#f6f6f2" stroke="#555" stroke-width="1.6"/><text x="42" y="236" font-size="13" font-weight="700" text-anchor="start" fill="#555">Этап 1</text><rect x="42" y="248" width="150" height="40" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="117.0" y="272.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Функц. требования</text><rect x="216" y="248" width="134" height="40" rx="7" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.5"/><text x="283.0" y="272.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Банк</text><path d="M192,268 L216,268" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="380" y="216" width="550" height="90" rx="12" fill="#f6f6f2" stroke="#555" stroke-width="1.6"/><text x="392" y="236" font-size="13" font-weight="700" text-anchor="start" fill="#555">Этап 2</text><rect x="392" y="248" width="60" height="40" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="422.0" y="272.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Вход</text><rect x="472" y="248" width="110" height="40" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="527.0" y="272.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Роли, словарь</text><rect x="602" y="248" width="100" height="40" rx="7" fill="#fff3cd" stroke="#b45309" stroke-width="1.5"/><text x="652.0" y="272.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Варианты</text><rect x="722" y="248" width="100" height="40" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="772.0" y="272.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222">Сценарии</text><path d="M360,268 L392,268" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M452,268 L472,268" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M582,268 L602,268" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><path d="M702,268 L722,268" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><text x="832" y="272" font-size="12.5" font-weight="400" text-anchor="start" fill="#b45309">только для</text><text x="832" y="288" font-size="12.5" font-weight="400" text-anchor="start" fill="#b45309">флага</text><text x="30" y="350" font-size="18" font-weight="700" text-anchor="start" fill="#222">Как работает выбор (пример)</text><rect x="30" y="413" width="210" height="90" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="135.0" y="445.0" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Требование</text><text x="135.0" y="466.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">«напомнить о записи»</text><text x="135.0" y="483.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">флаг: несколько способов</text><path d="M240,458 L265,458" fill="none" stroke="#333" stroke-width="1.8"/><path d="M265,410 L265,524" fill="none" stroke="#333" stroke-width="1.8"/><path d="M265,404 L290,404" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="290" y="379" width="290" height="50" rx="10" fill="#f2f2f2" stroke="#999" stroke-width="1.8" stroke-dasharray="6 4"/><text x="435.0" y="399.5" font-size="15" font-weight="700" text-anchor="middle" fill="#777">A · SMS</text><text x="435.0" y="420.5" font-size="14" font-weight="400" text-anchor="middle" fill="#666">отклонён — остаётся в банке</text><path d="M265,462 L290,462" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="290" y="437" width="290" height="50" rx="10" fill="#e3f1e3" stroke="#3f8a3f" stroke-width="1.8"/><text x="435.0" y="457.5" font-size="15" font-weight="700" text-anchor="middle" fill="#222">B · письмо на e-mail</text><text x="435.0" y="478.5" font-size="14" font-weight="400" text-anchor="middle" fill="#444">выбран</text><path d="M265,520 L290,520" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="290" y="495" width="290" height="50" rx="10" fill="#f2f2f2" stroke="#999" stroke-width="1.8" stroke-dasharray="6 4"/><text x="435.0" y="515.5" font-size="15" font-weight="700" text-anchor="middle" fill="#777">C · SMS и e-mail</text><text x="435.0" y="536.5" font-size="14" font-weight="400" text-anchor="middle" fill="#666">отклонён — остаётся в банке</text><path d="M580,462 L640,462" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/><rect x="640" y="422" width="290" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="1.8"/><text x="785.0" y="449.0" font-size="17" font-weight="700" text-anchor="middle" fill="#222">Сценарий</text><text x="785.0" y="470.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">«Пациент получает напоминание</text><text x="785.0" y="487.0" font-size="14" font-weight="400" text-anchor="middle" fill="#444">по e-mail»; вариант B записан</text><text x="30" y="588" font-size="14" font-weight="400" text-anchor="start" fill="#333">• В этапе 1 требование описывает «что», а не «как»; флаг «есть несколько способов» ставится при его формировании.</text><text x="30" y="609" font-size="14" font-weight="400" text-anchor="start" fill="#333">• Шаг «Варианты» в этапе 2 срабатывает только для таких требований; без флага он пропускается.</text><text x="30" y="630" font-size="14" font-weight="400" text-anchor="start" fill="#333">• Выбор — по режиму: вручную вы; на воротах агент рекомендует, вы подтверждаете на «Приёмке сценариев»;</text><text x="30" y="651" font-size="14" font-weight="400" text-anchor="start" fill="#333">   автопилот — агент с обоснованием.</text><text x="30" y="672" font-size="14" font-weight="400" text-anchor="start" fill="#333">• Код проверяет: у требования с вариантами выбран ровно один; отклонённые «висящими» не считаются.</text><text x="30" y="710" font-size="15" font-weight="700" text-anchor="start" fill="#b45309">Механика «Варианты» из Графа идеи сохранена — переезжает только место шага.</text></svg></body></html>
