[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pacage-studio"
dynamic = ["version"]
description = "Офлайн-карта пути HTTP-запроса по AST: endpoint → scenario → io → model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "mcp>=1.2"]
authors = [{name="studio"}]
license = {text="MIT"}
keywords = ["fastapi", "ast", "architecture", "visualization", "fastbase"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
full = ["fastbase[full] @ git+https://github.com/senia-glitch/fastapi-transport.git"]
# mcp теперь обязательная зависимость; extra оставлен пустым, чтобы старые команды установки
# `pip install "pacage-studio[mcp]"` не ломались.
mcp = []
dev = ["pytest>=8", "ruff>=0.6", "pytest-cov>=5"]

[project.urls]
Homepage = "https://github.com/senia-glitch/pacage-studio-ide"
Repository = "https://github.com/senia-glitch/pacage-studio-ide"

[project.scripts]
studio = "studio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["studio", "studio.*"]

[tool.setuptools.dynamic]
version = {attr = "studio.__version__"}

[tool.setuptools.package-data]
"studio.ui" = ["static/*.html", "static/*.css", "static/js/*.js", "static/js/idea/*.js", "static/js/pipeline/*.js", "static/js/package.json"]
"studio.metadata" = ["rules.md"]
"studio.agent" = ["rules.md", "guide.md"]
"studio.productchain" = ["assets/opencode/agents/*.md", "assets/opencode/skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["golden", ".venv", "build", "dist"]
addopts = "-q"
markers = [
    "slow: долгие тесты",
    "e2e: браузерные тесты (нужен Playwright)",
    "integration: HTTP-сервер, subprocess, watcher или потоки",
]

[tool.coverage.run]
branch = true
source = ["studio"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv*", "pytest-of-*", ".pytest_tmp*", ".tmp*", "probe*", ".probe_dir", "tmp*", "pip-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Тесты этапа «Идея» подключают фикстуру make явным импортом (conftest.py в подпапке занял бы имя
# модуля conftest у остальных тестов), поэтому параметр теста «переопределяет» импорт.
"tests/idea/*" = ["E501", "F811"]
# Этап «Идея»: в этих файлах тексты подсказок агентам и сообщения человеку. Перенос строк внутри
# них менял бы сами подсказки, поэтому длину строки здесь не проверяем.
"studio/idea/flow.py" = ["E501"]
"studio/idea/tools.py" = ["E501"]
"studio/idea/check.py" = ["E501"]
"studio/idea/rules.py" = ["E501"]
"studio/idea/project.py" = ["E501"]
# Конвейер: тексты подсказок ролям — перенос строк менял бы сами подсказки.
"studio/pipeline/stage1.py" = ["E501"]
"studio/pipeline/engine.py" = ["E501"]
"studio/pipeline/stage3.py" = ["E501"]
"studio/pipeline/stage4.py" = ["E501"]
"studio/pipeline/tz.py" = ["E501"]
"studio/pipeline/coder.py" = ["E501"]
"studio/pipeline/prompts.py" = ["E501"]
"studio/pipeline/stage5.py" = ["E501"]
"studio/pipeline/entry.py" = ["E501"]