[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pacage-studio"
dynamic = ["version"]
description = "Офлайн-карта пути HTTP-запроса по AST: endpoint → scenario → io → model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]
authors = [{name="studio"}]
license = {text="MIT"}
keywords = ["fastapi", "ast", "architecture", "visualization", "fastbase"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
full = ["fastbase[full] @ git+https://github.com/senia-glitch/fastapi-transport.git"]
dev = ["pytest>=8", "ruff>=0.6", "pytest-cov>=5"]

[project.urls]
Homepage = "https://github.com/senia-glitch/pacage-studio"
Repository = "https://github.com/senia-glitch/pacage-studio"

[project.scripts]
studio = "studio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["studio*"]

[tool.setuptools.dynamic]
version = {attr = "studio.__version__"}

[tool.setuptools.package-data]
"studio.ui" = ["static/*.html", "static/*.css", "static/js/*.js", "static/js/package.json"]
"studio.metadata" = ["rules.md"]
"studio.agent" = ["rules.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["golden", ".venv", "build", "dist"]
addopts = "-q"
markers = [
    "slow: долгие тесты",
    "e2e: браузерные тесты (нужен Playwright)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["text.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
