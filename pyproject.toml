[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pacage-studio"
version = "3.0.0"
description = "Офлайн-карта пути HTTP-запроса по AST: endpoint → scenario → io → model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]
authors = [{name="studio"}]
license = {text="MIT"}

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
studio = "studio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["studio*"]

[tool.setuptools.package-data]
"studio.ui" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
